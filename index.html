  /* ================= Экспорт всех анкет в Excel (только админ, вкладка «Инструменты») ================= */
  $("toolExportIc").innerHTML = icon("download", 20);
  let exportBusy = false;

  /* Библиотека SheetJS грузится с CDN только при первом экспорте —
     обычные посетители её не качают */
  function loadXLSXLib() {
    return new Promise((res, rej) => {
      if (window.XLSX) return res();
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("XLSX library failed to load"));
      document.head.appendChild(s);
    });
  }

  /* Дата из ответа сервера (createdAt/updatedAt) или числа мс (expiresAt) */
  function fmtTs(v) {
    if (v === null || v === undefined || v === "") return "";
    try {
      const d = typeof v.toDate === "function" ? v.toDate()
        : (typeof v.seconds === "number" ? new Date(v.seconds * 1000) : new Date(Number(v)));
      if (isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return ""; }
  }

  /* Строки для Excel — все поля анкеты, значения по-человечески (не id) */
  function buildExportRows(docs) {
    return (docs || []).map(p => {
      const cat = CATS.find(c => c.id === p.category || c.base === p.category);
      const lv = cat && cat.levels ? cat.levels.find(l => l.id === p.group) : null;
      const routes = Array.isArray(p.routes) ? p.routes : [];
      return {
        "ID": p.id || "",
        "Название (ар)": (p.names && p.names.ar) || p.title || "",
        "Название (en)": (p.names && p.names.en) || "",
        "Категория": cat ? catName(cat) : (p.category || ""),
        "Уровень": lv ? levelName(lv) : "",
        "Подкатегория": p.subcategory ? subName(p.group || p.category, p.subcategory) : "",
        "Город": cityName(p.city),
        "Телефон": p.phone || "",
        "Локация": p.location || "",
        "Маршруты": routes.map(id => cityName(id)).join(", "),
        "Марка авто": p.carMake || "",
        "Просмотры": p.views || 0,
        "Описание": p.description || "",
        "Создано": fmtTs(p.createdAt),
        "Обновлено": fmtTs(p.updatedAt),
        "Действует до": fmtTs(p.expiresAt)
      };
    });
  }

  function exportExcel() {
    const rows = buildExportRows(state.docs);
    if (!rows.length) { toast(t("exportEmpty"), "err"); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    /* ширины колонок по самой длинной ячейке (потолок 40) */
    ws["!cols"] = Object.keys(rows[0]).map(k => ({
      wch: Math.min(40, Math.max(k.length + 2, ...rows.map(r => String(r[k] ?? "").length + 2)))
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Анкеты");
    const dte = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    XLSX.writeFile(wb, `dalil-ankety-${dte.getFullYear()}-${pad(dte.getMonth() + 1)}-${pad(dte.getDate())}.xlsx`);
    toast(t("exportDone").replace("{n}", rows.length));
  }

  $("toolExportBtn").addEventListener("click", async () => {
    if (exportBusy) return;
    exportBusy = true;
    toast(t("exportBusy"));
    try {
      await loadXLSXLib();
      exportExcel();
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    }
    exportBusy = false;
  });

  /* ================= v1.3.0 · Бэкап всех анкет в JSON =================
     Полная копия providers одним файлом — страховка перед массовыми
     изменениями и способ переноса на другой проект. */
  $("toolBackupIc").innerHTML = icon("db", 20);
  $("toolSweepIc").innerHTML = icon("trash", 20);
  $("toolLogoutIc").innerHTML = icon("logout", 20);

  $("toolBackupBtn").addEventListener("click", () => {
    try {
      const dte = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const fname = `dalil-backup-${dte.getFullYear()}-${pad(dte.getMonth() + 1)}-${pad(dte.getDate())}.json`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(
        [JSON.stringify({ app: "DALIL SURIYA", version: APP_VERSION, exportedAt: dte.toISOString(), count: state.docs.length, providers: state.docs }, null, 2)],
        { type: "application/json;charset=utf-8" }));
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      toast(t("toolBackupOk"));
    } catch (err) { console.error(err); }
  });

  /* Удалить просроченные: двухшаговое подтверждение прямо на кнопке */
  let sweepArmed = null;
  $("toolSweepBtn").addEventListener("click", async () => {
    const expired = state.docs.filter(isExpired);
    if (!expired.length) { toast(t("toolSweepNone")); return; }
    if (sweepArmed !== true) {
      sweepArmed = true;
      toast(t("toolSweepArm"), "err", 4000);
      setTimeout(() => { sweepArmed = null; }, 4000);
      return;
    }
    sweepArmed = null;
    let n = 0;
    for (const p of expired) {
      try { await dbRemove(p.id); n++; }
      catch (err) { console.error("Sweep:", err); }
    }
    toast(t("toolSweepDone").replace("{n}", String(n)));
  });

  $("toolLogoutBtn").addEventListener("click", () => {
    adminLogout(true);
    closeOv("admOverlay");
    toast(t("toastLoggedOut"));
  });

  /* ================= v1.2.3 · Очередь заявок (только админ) =================
     Публичная форма пишет в applications со статусом pending.
     «Одобрить» = анкета переносится в providers и появляется в справочнике,
     «Отклонить» = заявка помечается отклонённой. Пока не одобрено — посетители её не видят. */
  let reqsTimer = null;
  let reqsInFlight = false;
  let reqsCache = [];

  function updateReqsBadge() {
    /* v1.3.0: бейджи рисует единый updateAdmBadges (вкладки + кнопка панели) */
    updateAdmBadges();
  }

  /* метка времени в мс: {seconds} с сервера | {toDate()} | ISO-строка | число */
  const tsOf = (v) => {
    if (!v) return 0;
    if (typeof v === "number") return v;
    if (typeof v.seconds === "number") return v.seconds * 1000;
    if (v.toDate) { try { return v.toDate().getTime(); } catch (e) {} }
    const t = Date.parse(v);
    return Number.isFinite(t) ? t : 0;
  };

  /* v1.4.0: живой канал заменён опросом нашего сервера (20 сек) */
  async function fetchReqs() {
    if (!state.admin || reqsInFlight) return;
    reqsInFlight = true;
    try {
      const j = await admFetch("/api/admin/applications?status=pending");
      reqsCache = (j.docs || []).sort((a, b) => tsOf(b.createdAt) - tsOf(a.createdAt));
      updateReqsBadge();
      if (state.admin && $("admOverlay").classList.contains("show") && admTab === "reqs") renderReqs();
    } catch (e) { console.warn("reqs poll:", e && e.message); }
    reqsInFlight = false;
  }
  function watchReqs() {
    if (reqsTimer) return;
    fetchReqs();
    reqsTimer = setInterval(fetchReqs, 20000);
  }
  function unwatchReqs() {
    if (reqsTimer) { clearInterval(reqsTimer); reqsTimer = null; }
    reqsCache = [];
    updateReqsBadge();
  }

  function renderReqs() {
    const list = $("admReqsList");
    $("admReqsCount").textContent = reqsCache.length
      ? `${reqsCache.length} · ${t("reqsPending")}`
      : t("reqsEmpty");
    if (!reqsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = reqsCache.map((r, i) => {
      const tel = (r.phone || "").replace(/[^\d+]/g, "");
      const routes = (Array.isArray(r.routes) && r.routes.length)
        ? `${esc(t("routeFrom"))}: ${esc(cityName(r.city))} ${flowArrow()} ${r.routes.map(id => esc(cityName(id))).join(" · ")}`
        : "";
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(r.planPrice || PLAN_PRICE[r.plan] || "")}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${tel ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
          ${r.location ? `<span>${icon("pin", 13)}${esc(r.location)}</span>` : ""}
          ${r.carMake ? `<span>${icon("car", 13)}${esc(r.carMake)}</span>` : ""}
        </div>
        ${routes ? `<div class="req-meta"><span>${icon("route", 13)}${routes}</span></div>` : ""}
        ${r.description ? `<p class="req-desc">${esc(r.description)}</p>` : ""}
        <div class="req-actions">
          <button type="button" class="btn btn-solid req-approve" data-id="${esc(r.id)}">${icon("check", 14)}${esc(t("reqsApprove"))}</button>
          <button type="button" class="btn btn-danger req-reject" data-id="${esc(r.id)}">${icon("x", 14)}${esc(t("reqsReject"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: очередь заявок открыается вкладкой «Заявки» в админ-панели */

  $("admReqsList").addEventListener("click", e => {
    const ap = e.target.closest(".req-approve");
    if (ap) { approveReq(ap.dataset.id, ap); return; }
    const rj = e.target.closest(".req-reject");
    if (rj) { rejectReq(rj.dataset.id, rj); return; }
  });

  /* v1.2.5: перемотка справочника к только что одобренной анкете —
     админ сразу ВИДИТ результат, а не ищет её по городам и категориям */
  function showApproved(r) {
    try {
      const cat = CATS.find(c => c.id === r.category || c.base === r.category);
      const cityOk = CITIES.some(c => c.id === r.city);
      const lvls = cat ? levelsOf(cat) : [];
      const grp = lvls.some(l => l.id === r.group) ? r.group : (lvls[0] && lvls[0].id);
      if (cityOk) { state.city = r.city; store.set("dalil_city", state.city); }
      if (cat) state.cat = cat.id;
      if (grp) state.level = grp;
      state.sub = "all";
      state.dest = "all";
      state.levelSelected = !(cat && cat.levels);
      closeOv("admOverlay");
      animCities = true; animCats = true;
      renderCities(); updateCityVisibility(); renderCats(); renderSubs(); renderList();
      setTimeout(() => { try { $("listWrap").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 80);
    } catch (e) { console.error(e); }
  }

  async function approveReq(id, btn) {
    const r = reqsCache.find(x => x.id === id);
    if (!r || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      /* v1.4.0: публикацию делает наш сервер — карточка создаётся из заявки,
         TTL считается по тарифу на сервере */
      const j = await admFetch("/api/admin/applications/" + encodeURIComponent(id) + "/approve", { method: "POST" });
      reqsCache = reqsCache.filter(x => x.id !== id);
      updateReqsBadge();
      await loadOnce();
      /* v1.2.5: сразу показываем результат — экран прыгает к новой анкете */
      showApproved(state.docs.find(d => d.id === j.providerId) || r);
      toast(t("reqsApproved"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsApprove");
    }
  }

  async function rejectReq(id, btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      await admFetch("/api/admin/applications/" + encodeURIComponent(id) + "/reject", { method: "POST" });
      reqsCache = reqsCache.filter(x => x.id !== id);
      updateReqsBadge();
      if ($("admOverlay").classList.contains("show") && admTab === "reqs") renderReqs();
      toast(t("reqsRejected"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsReject");
    }
  }

  /* ================= v1.2.7 · Напоминания об истечении (только админ) =================
     За 3 дня до конца срока (expiresAt) анкета попадает в панель «Напоминания».
     Панель сама открывается раз в сессию при входе админа; каждая карточка —
     кнопка «Напомнить»: WhatsApp владельца открывается с ГОТОВЫМ сообщением
     (имя, город, дата истечения, тариф, цена) на языке анкеты (uiLang, иначе арабский).
     «Напомнить»/«Пропустить» запоминаются в localStorage до конца дня —
     при продлении expiresAt меняется, и напоминание появится снова в новое окно. */
  const REM_WINDOW = 3 * 86400000;   /* напоминать за 3 дня до истечения TTL */
  const REM_MAP_KEY = "dalil_rem";
  const REM_SEEN_KEY = "dalil_rem_seen";
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const loadRemMap = () => { try { return JSON.parse(store.get(REM_MAP_KEY) || "{}") || {}; } catch { return {}; } };
  let remCache = [];

  function updateReminders() {
    const now = Date.now();
    const map = loadRemMap();
    remCache = state.docs
      .filter(p => p.expiresAt && p.expiresAt > now && p.expiresAt - now <= REM_WINDOW)
      .filter(p => !(map[p.id] && map[p.id].e === p.expiresAt && map[p.id].d === dayKey(now)))
      .sort((a, b) => a.expiresAt - b.expiresAt);   /* срочные сверху */
    updateRemBadge();
    maybeAutoOpenRems();
  }

  function updateRemBadge() {
    /* v1.3.0: бейджи рисует единый updateAdmBadges (вкладки + кнопка панели) */
    updateAdmBadges();
  }

  /* Панель сама открывается на вкладке «Напоминания» раз за сессию,
     если есть кому напомнить */
  function maybeAutoOpenRems() {
    if (!state.admin || !remCache.length) return;
    try { if (sessionStorage.getItem(REM_SEEN_KEY)) return; sessionStorage.setItem(REM_SEEN_KEY, "1"); } catch {}
    openAdmPanel("rems");
  }

  function markReminded(id) {
    const map = loadRemMap();
    const r = remCache.find(x => x.id === id);
    if (r) map[id] = { e: r.expiresAt, d: dayKey(Date.now()) };
    store.set(REM_MAP_KEY, JSON.stringify(map));
  }

  function renderRems() {
    const list = $("admRemList");
    $("admRemCount").textContent = remCache.length
      ? `${remCache.length} · ${t("remPending")}`
      : t("remEmpty");
    if (!remCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = remCache.map((r, i) => {
      const tel = (r.phone || "").replace(/\D/g, "");
      const days = Math.max(1, Math.ceil((r.expiresAt - Date.now()) / 86400000));
      /* Сообщение владельцу — на языке его анкеты (uiLang), по умолчанию арабский */
      const ml = (r.uiLang && I18N[r.uiLang]) ? r.uiLang : "ar";
      const planTxt = t(r.plan === "m1" ? "subM1" : r.plan === "m3" ? "subM3" : "subY1", ml);
      const price = r.planPrice || PLAN_PRICE[r.plan] || "";
      const cObj = cityById(r.city);
      const cityTxt = cObj ? (cObj[ml] || cObj.ar || cObj.ku || cObj.ru) : (r.city || "");
      const d = new Date(r.expiresAt);
      const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
      const msg = encodeURIComponent(
        t("remWaMsg", ml)
          .replace("{name}", r.title || "")
          .replace("{city}", cityTxt)
          .replace("{date}", dateStr)
          .replace("{n}", String(days))
          .replace("{plan}", planTxt)
          .replace("{price}", price));
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(price)}</span>
          <span class="rem-warn">${icon("bell", 12)}${esc(t("remDays").replace("{n}", String(days)))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${r.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
        </div>
        <div class="req-actions">
          ${tel
            ? `<a class="btn btn-solid" href="https://wa.me/${esc(tel)}?text=${msg}" target="_blank" rel="noopener" data-remind="${esc(r.id)}">${icon("send", 14)}${esc(t("remRemind"))}</a>
             <button type="button" class="btn btn-outline" data-remskip="${esc(r.id)}">${icon("x", 14)}${esc(t("remSkip"))}</button>`
            : `<span class="req-desc">${esc(t("remNoPhone"))}</span>`}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: напоминания открыаются вкладкой «Напоминания» в админ-панели */

  $("admRemList").addEventListener("click", e => {
    const sk = e.target.closest("[data-remskip]");
    if (sk) {
      markReminded(sk.dataset.remskip);
      remCache = remCache.filter(x => x.id !== sk.dataset.remskip);
      updateRemBadge();
      renderRems();
      toast(t("remSkippedToast"));
      return;
    }
    const rd = e.target.closest("[data-remind]");
    if (rd) {
      markReminded(rd.dataset.remind);
      remCache = remCache.filter(x => x.id !== rd.dataset.remind);
      updateRemBadge();
      renderRems();   /* карточка уходит из списка — считаем напоминание отправленным */
      toast(t("remOpenedToast"));
    }
  });

  /* ================= v1.3.0 · ЯДРО АДМИН-ПАНЕЛИ =================
     Одна организованная панель вместо разрозненных кнопок:
     • 4 живые статкарточки (пересчёт на каждом снапшоте);
     • 5 вкладок: Заявки · Напоминания · Жалобы · Анкеты · Инструменты;
     • реестр анкет с поиском и продлением TTL в один клик;
     • жалобы посетителей из коллекции reports. */

  let admTab = "reqs";          /* активная вкладка панели */
  let admSearchQ = "";          /* поисковый запрос в реестре анкет */
  let repsTimer = null;
  let repsInFlight = false;
  let repsCache = [];

  /* ---------- Бейджи: вкладки + плавающая кнопка ---------- */
  function setBadge(el, n) {
    if (!el) return;
    el.hidden = !n;
    if (n) el.textContent = n > 99 ? "99+" : String(n);
  }
  function updateAdmBadges() {
    if (!state.admin) return;
    setBadge($("admReqBadge"), reqsCache.length);
    setBadge($("admRemBadge"), remCache.length);
    setBadge($("admRepBadge"), repsCache.length);
    setBadge($("floatPanelBadge"), reqsCache.length + remCache.length + repsCache.length);
    if ($("admOverlay").classList.contains("show")) renderAdmStats();
  }

  /* ---------- Жалобы (reports) ---------- */
  /* v1.4.0: жалобы — опрос нашего сервера (20 сек) */
  async function fetchReps() {
    if (!state.admin || repsInFlight) return;
    repsInFlight = true;
    try {
      const j = await admFetch("/api/admin/reports?status=new");
      repsCache = (j.docs || []).sort((a, b) => tsOf(b.createdAt) - tsOf(a.createdAt));
      updateAdmBadges();
      if ($("admOverlay").classList.contains("show") && admTab === "reps") renderReports();
    } catch (e) { console.warn("reps poll:", e && e.message); }
    repsInFlight = false;
  }
  function watchReports() {
    if (repsTimer) return;
    fetchReps();
    repsTimer = setInterval(fetchReps, 20000);
  }
  function unwatchReports() {
    if (repsTimer) { clearInterval(repsTimer); repsTimer = null; }
    repsCache = [];
    updateAdmBadges();
  }

  const REP_REASON_KEYS = { dead: "repR1", fake: "repR2", wrong: "repR3", other: "repR4" };

  function renderReports() {
    const list = $("admRepList");
    $("admRepCount").textContent = repsCache.length
      ? `${repsCache.length} · ${t("statReps")}`
      : t("repEmpty");
    if (!repsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = repsCache.map((r, i) => `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan" style="color:#E07A6C;background:rgba(224,122,108,.12);border-color:rgba(224,122,108,.45)">${icon("flag", 12)}${esc(t(REP_REASON_KEYS[r.reason] || "repR4"))}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>

  /* ---------- Реестр анкет (вкладка «Анкеты») ---------- */
  function ttlPill(p) {
    if (!p.expiresAt) return `<span class="ttl-pill ttl-warn">${esc(t("pillOld"))}</span>`;
    const ms = Number(p.expiresAt) - Date.now();
    if (ms <= 0) return `<span class="ttl-pill ttl-dead">${esc(t("pillExpired"))}</span>`;
    const days = Math.ceil(ms / 86400000);
    const d = new Date(Number(p.expiresAt));
    const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    if (days <= 7) return `<span class="ttl-pill ttl-warn">${esc(t("pillDays").replace("{n}", String(days)))}</span>`;
    return `<span class="ttl-pill ttl-ok">${esc(t("pillOk").replace("{d}", dateStr))}</span>`;
  }

  function renderAdmDocs() {
    const q = admSearchQ.toLowerCase();
    const qs = q.replace(/\s/g, "");
    const items = state.docs
      .filter(d => !q ||
        (d.title || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.names && Object.values(d.names).some(v => String(v || "").toLowerCase().includes(q))) ||
        cityName(docCityId(d)).toLowerCase().includes(q))
      .sort((a, b) => {
        const ea = a.expiresAt ? Number(a.expiresAt) : Infinity;
        const eb = b.expiresAt ? Number(b.expiresAt) : Infinity;
        if ((ea <= Date.now()) !== (eb <= Date.now())) return (ea <= Date.now()) ? -1 : 1;
        return ea - eb;   /* срочные и просроченные сверху */
      });
    $("admDocsCount").textContent = `${t("found")}: ${items.length}`;
    const list = $("admDocsList");
    if (!items.length) { list.innerHTML = ""; return; }
    list.innerHTML = items.map((p, i) => {
      const tel = (p.phone || "").replace(/[^\d+]/g, "");
      return `
      <div class="adm-doc" style="animation-delay:${Math.min(i * 35, 250)}ms">
        <div class="adm-doc-top">
          <span class="adm-doc-name">${esc(pname(p))}</span>
          ${ttlPill(p)}
        </div>
        <div class="req-meta">
          ${p.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(p.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(docCityId(p)))}</span>
          <span>${icon("book", 13)}${esc(subName(p.group, p.subcategory))}</span>
          <span>${icon("eye", 13)}${fmtViews(p.views)}</span>
        </div>
        <div class="adm-doc-actions">
          ${p.expiresAt ? `
          <button type="button" class="btn btn-outline btn-renew" data-renew="m1" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renM1"))}</button>
          <button type="button" class="btn btn-outline btn-renew" data-renew="m3" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renM3"))}</button>
          <button type="button" class="btn btn-outline btn-renew" data-renew="y1" data-id="${esc(p.id)}">${icon("bell", 13)}${esc(t("renY1"))}</button>`
          : ""}
          <button type="button" class="btn btn-outline adm-edit" data-id="${esc(p.id)}">${icon("edit", 13)}${esc(t("edit"))}</button>
          <button type="button" class="btn btn-danger adm-del" data-id="${esc(p.id)}">${icon("trash", 13)}${esc(t("delete"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 13)}${esc(t("call"))}</a>` : ""}

  /* Продление TTL в один клик: срок отсчитывается от max(сейчас, текущий срок),
     чтобы активную анкету не укорачивать, а просроченную — не обидеть прошлым */
  async function renewProvider(id, plan, btn) {
    const p = state.docs.find(d => d.id === id);
    if (!p) return;
    if (btn) btn.disabled = true;
    try {
      const base = Math.max(Date.now(), Number(p.expiresAt) || 0);
      await dbUpdate(id, { expiresAt: base + (PLAN_TTL[plan] || PLAN_TTL.m1) });
      toast(t("toastRenewed"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    }
    if (btn) btn.disabled = false;
  }

  /* ============ v1.6.0 · Аккаунты: приветствие / вход / гость / гейты ============

       (анкета/отзыв/избранное) просят «Создайте аккаунт или войдите». ============ */

  const USER_KEY  = "dalil_user";

  const API       = "https://dalil-api.dalil-suriya.workers.dev";

  /* Бренд-иконки (многоцветный Google, фирменные Facebook/WhatsApp) */
  const BRAND = {

  const icSet = (id, svg) => { const el = document.getElementById(id); if (el) el.innerHTML = svg; };
  icSet("icMail", BRAND.mail);       icSet("icWhats", BRAND.whatsapp);

  /* --- Сессия и аккаунты --- */

  /* --- v1.4.0 · Удаление аккаунта (Настройки → «Удалить аккаунт») ---

     паролем, соцаккаунт — без пароля (на сервере проверяется confirm:true).
     После удаления: сессия чистится, приветствие возвращается, вход этим
     аккаунтом больше невозможен — данные стёрты из D1 безвозвратно. --- */
  let delBusy = false;
  function openDelAcc() {
    if (!isAuthed()) return;
    $("delAccErr").classList.remove("show");
    const emailAcc = state.user.p === "email";
    $("delPassF").hidden = !emailAcc;
    $("delPass").value = "";
    $("delAccT").textContent = t("accDelT");
    $("delAccD").textContent = t("accDelD").replace("{n}", accLabel());
    $("delAccBtn").textContent = t("accDelBtn");

  }
  $("accDeleteBtn").addEventListener("click", openDelAcc);
  $("delAccCancel").addEventListener("click", () => closeOv("delAccOverlay"));
  $("delAccForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (delBusy || !isAuthed()) return;
    const err = $("delAccErr"); err.classList.remove("show");
    const emailAcc = state.user.p === "email";
    const pass = $("delPass").value;
    if (emailAcc && !pass) return bannerMsg(err, t("accDelEmpty"));
    delBusy = true;
    const btn = $("delAccBtn"), old = btn.textContent;
    btn.disabled = true; btn.textContent = "…";
    let errMsg = "", ok = false;
    try {
      const r = await fetch(API + "/api/auth/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + (store.get(TOKEN_KEY) || "") },
        body: JSON.stringify(emailAcc ? { password: pass } : { confirm: true }),
      });
      if (r.status === 401 && !emailAcc) {  /* сессия истекла — входим заново */
        setUser(null);
        closeOv("delAccOverlay"); closeOv("settingsOverlay");
        toast(t("tBye"));
        delBusy = false; btn.disabled = false; btn.textContent = old;
        return;
      }
      const j = await r.json();
      if (j && j.ok) ok = true;
      else errMsg = j && (j.error === "bad_password" || j.error === "confirm_required") ? t("accDelErr") : t("eNet");
    } catch (e2) { errMsg = t("eNet"); }
    delBusy = false; btn.disabled = false; btn.textContent = old;
    if (errMsg) return bannerMsg(err, errMsg);

      closeOv("delAccOverlay");
      closeOv("settingsOverlay");
      toast(t("tAccDel"));

  });

  /* --- Модалка входа/регистрации (email + пароль → реальный сервер) --- */
  let auMode = "login", auBusy = false;
  function openAuth(mode) {
    auMode = mode || "login";
    $("authErr").classList.remove("show");
    updateAuthUI();
    openOv("authOverlay");
  }
  function updateAuthUI() {
    $("auTitle").textContent = t(auMode === "login" ? "auTabLogin" : "auTabReg");
    $("auSubmit").textContent = t(auMode === "login" ? "login" : "auBtnReg");
    $("auNameF").hidden = auMode !== "reg";
    $("auEmailF").hidden = false;
    $("auPassF").hidden = false;
    $("auPass").autocomplete = auMode === "login" ? "current-password" : "new-password";
    const sw = $("auSwitch");
    if (sw) sw.textContent = auMode === "login" ? t("auToReg") : t("auToLogin");
    document.querySelectorAll("#auMethods [data-aum]").forEach(b =>
      b.classList.toggle("on", b.dataset.aum === "email"));
  }
  $("auSwitch").addEventListener("click", () => {
    auMode = auMode === "login" ? "reg" : "login";
    $("authErr").classList.remove("show");
    updateAuthUI();
  });
  /* WhatsApp/SMS среди методов — честная заглушка «скоро» */
  document.querySelectorAll("#auMethods [data-soon]").forEach(b =>
    b.addEventListener("click", () => toast(t("auSoonW"))));
  $("auForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (auBusy) return;
    const err = $("authErr"); err.classList.remove("show");
    const name = $("auName").value.trim();
    const email = $("auEmail").value.trim().toLowerCase();
    const pass = $("auPass").value;
    if (auMode === "reg" && name.length < 2) return bannerMsg(err, t("eName"));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return bannerMsg(err, t("eEmail"));
    if (pass.length < 6) return bannerMsg(err, t("ePass"));
    auBusy = true;
    const btn = $("auSubmit"), old = btn.textContent;
    btn.disabled = true; btn.textContent = "…";
    let errMsg = "", j = null;
    try {
      const r = await fetch(API + (auMode === "reg" ? "/api/auth/register" : "/api/auth/login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(auMode === "reg" ? { name, email, password: pass } : { email, password: pass }),
      });
      j = await r.json();
      if (!j.ok) errMsg = authApiErr(j.error);
    } catch (e2) { errMsg = t("eNet"); }
    auBusy = false;
    btn.disabled = false; btn.textContent = old;
    if (errMsg) bannerMsg(err, errMsg);
    else if (j && j.ok)
      finishLogin({ p: "email", id: j.user.id, n: j.user.name || email, e: j.user.ident, token: j.token }, auMode === "reg");
  });
  function authApiErr(code) {
    return code === "email_taken"     ? t("eExists")
         : code === "bad_credentials" ? t("eCreds")
         : code === "bad_email"       ? t("eEmail")
         : code === "bad_password"    ? t("ePass")
         : code === "bad_name"        ? t("eName")
         : code === "rate_limit"      ? t("eRate")
         : t("eNet");
  }
  function finishLogin(u, fresh) {
    try { if (u && u.token) localStorage.setItem(TOKEN_KEY, u.token); } catch (e) {}
    setUser(u);
    closeOv("authOverlay");
    toast(t(fresh ? "tRegDone" : "tLoginDone"));
  }

  /* --- Реальная сессия: восстанавливаем/проверяем профиль по токену сервера --- */
  (async function restoreSession() {
    const tok = store.get(TOKEN_KEY);
    if (!tok || !state.user || state.user.g) return;
    try {
      const r = await fetch(API + "/api/me", { headers: { Authorization: "Bearer " + tok } });
      if (r.status === 401 || r.status === 404) { setUser(null); return; }  /* токен истёк или аккаунт удалён — чистим */
      const j = await r.json();
      if (j.ok && j.user) {
        state.user = { ...state.user, id: j.user.id, n: j.user.name || state.user.n, e: j.user.ident || state.user.e };
        try { localStorage.setItem(USER_KEY, JSON.stringify(state.user)); } catch (e) {}
        renderAuthUI();
      }
    } catch (e) { /* офлайн — оставляем локальный профиль */ }
  })();

  /* v1.4.0: Google/Facebook через Firebase удалены ПОЛНОСТЬЮ.
     Сервер готов к прямому входу Google/Facebook без Firebase
     (GET /api/auth/config скажет, заданы ли OAuth-ключи) — кнопки
     вернутся автоматически, когда владелец добавит ключи на сервер. */

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("gearIc").innerHTML = icon("gear", 18);
      $("setThemeIc").innerHTML = icon("sun", 13);
      $("segLightIc").innerHTML = icon("sun", 15);
      $("segDarkIc").innerHTML = icon("moonIc", 15);
      $("setLangIc").innerHTML = icon("globe", 13);
      $("setWarnIc").innerHTML = icon("trash", 13);   /* v1.4.0: удаление аккаунта */
      $("accDelIc").innerHTML = icon("trash", 16);
      $("delAccIc").innerHTML = icon("trash", 30);
      $("searchIcon").innerHTML = icon("search", 18);
      /* v1.3.0: иконки новых блоков */
      $("notifBtnIc").innerHTML = icon("bell", 18);
      $("mapIc").innerHTML = icon("map", 20);
      $("nearMeIc").innerHTML = icon("locate", 14);
      $("bnHomeIc").innerHTML = icon("home", 21);
      $("bnMapIc").innerHTML = icon("map", 21);
      $("bnNotifIc").innerHTML = icon("bell", 21);
      $("bnFavIc").innerHTML = icon("heart", 21);
      $("fMapBtnIc").innerHTML = icon("pin", 15);
      $("aMapBtnIc").innerHTML = icon("pin", 15);
      $("panelIc").innerHTML = icon("gear", 16);
      $("citiesIcon").innerHTML = icon("city", 22);
      $("admGearIc").innerHTML = icon("gear", 20);
      $("admSearchIc").innerHTML = icon("search", 17);
      $("agentIc2").innerHTML = icon("user", 20);
      $("appAgreeBox").innerHTML = icon("check", 14);
      $("appDoneIc").innerHTML = icon("check", 30);
      $("appDoneWaIc").innerHTML = icon("chat", 15);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      state.levelSelected = !catById(state.cat).levels;
      applyLang();
      renderAll();
      updateCityVisibility();
      startListener();
    } catch (e) {
      console.error(e);
      toast("⚠ " + (e.message || "خطأ في التهيئة"), "err");
    }
  })();
</script>
