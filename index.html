<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>دليل سوريا · DALIL SURIYA — Справочник Сирии</title>
<script>
  /* Тема до первой отрисовки — без вспышки тёмного фона у выбравших светлую */
  try { if (localStorage.getItem("dalil_theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7z' fill='none' stroke='%23AF7F42' stroke-width='2'/><path d='M12 7l4.5 2.6v5.2L12 17.5l-4.5-2.7V9.6z' fill='%23AF7F42'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     DALIL SURIYA · v1.3.4 — Midnight Gold + промо + рейтинг через REST
     Мобильное приложение: стеклянная шапка, плавающие карточки,
     нижняя навигация-док, карта, уведомления, рейтинг.
     Токены сохраняют старые имена (--bg/--card/--accent…) — JS не тронут.

     v1.3.4 — фикс «нет интернета» при оценке: голос уходит коротким
     HTTPS POST с очередью dalil_voteq (автодолёт при появлении связи).
     v1.4.0 — Firebase удалён полностью: каталог, заявки, жалобы, оценки,
     просмотры, админка и аккаунты живут на нашем сервере dalil-api (D1).
     3) ЯЗЫК УСТРОЙСТВА при первом запуске: телефон на русском → приложение
        на русском (раньше всегда был жёсткий арабский до ручного выбора).
     4) АВТООБНОВЛЕНИЕ КАЖДУЮ МИНУТУ у всех: сторож сверяется с сервером
        напрямую, даже если push-канал умер в мобильной сети;
        без изменений экран не трогается, при возврате в приложение —
        мгновенная сверка.
     (v1.3.2: рейтинг с очередью dalil_voteq; промо-ивент «1 месяц бесплатно»
     до 17.10.2026 с автоснятием — сторож каждую минуту + при загрузке.)

     ХОТФИКС v1.3.1 (скролл на телефонах): причина блокировки свайпов —
     связка body{overflow-x:hidden} (делает body отдельным scroll-контейнером)
     и body{overscroll-behavior-y:contain} из @media(max-width:820px)
     (запрещает цепочку жеста к корневому скроллеру). Жест, начатый в контенте,
     умирал в body и не доходил до вьюпорта; position:fixed док и режим ПК
     (980px, медиаправило не применяется) работали — отсюда симптомы.
     Исправление: contain перенесён на html (корневой скроллер — там он и
     задуман), у body overflow-x теперь clip (не создаёт scroll-контейнер).
     ================================================================ */
  :root{
    --bg:#0A101C;
    --bg2:#0E1626;
    --panel:#111B2E;            /* поверхности: карточки, модалки, тосты */
    --panel2:#16223A;
    --panel-text:#E8EDF4;
    --card:#DCE4EE;             /* основной текст на странице */
    --muted:#7E8AA1;
    --accent:#C2924F;
    --accent2:#C97B4F;
    --accent-hi:#E2B169;
    --accent-lo:#6E542C;
    --on-accent:#1A130A;
    --line:rgba(126,138,161,.30);
    --line-soft:rgba(126,138,161,.16);
    --surface:rgba(220,228,238,.05);
    --hover-tint:rgba(194,146,79,.12);
    --bar-bg:rgba(10,16,28,.86);
    --overlay-bg:rgba(5,9,17,.62);
    --input-bg:rgba(255,255,255,.05);
    --shadow-card:0 14px 34px -22px rgba(0,0,0,.6);
    --shadow-pop:0 24px 60px -24px rgba(0,0,0,.7);
    --gold-grad:linear-gradient(135deg,#E2B169,#C2924F 60%,#A87B3F);
    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  /* v1.3.1: overscroll-behavior-y:contain — ТОЛЬКО на корневом скроллере (html):
     гасит pull-to-refresh/резинку в APK и НЕ блокирует тач-скролл.
     (Стоявший раньше на body contain в паре с overflow-x:hidden запирал свайпы.) */
  html{ scroll-behavior:smooth; overflow-x:hidden; overscroll-behavior-y:contain; -webkit-tap-highlight-color:transparent; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  ::selection{ background:rgba(194,146,79,.45); color:#fff; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo)); border-radius:99px; }
  *{ scrollbar-width:thin; scrollbar-color:rgba(194,146,79,.45) transparent; }
  html[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Golos Text',sans-serif; }
  html[dir="rtl"] *{ letter-spacing:normal !important; }
  body{
    background: var(--bg);
    color: var(--card);
    font-family: 'Golos Text','Noto Sans','Noto Kufi Arabic',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    overflow-x: hidden; /* фолбэк для старых WebView, не знающих clip */
    overflow-x: clip;   /* v1.3.1: clip НЕ создаёт scroll-контейнер — свайпы не запираются */
    width: 100%;
    padding-bottom: 104px; /* место под нижний док */
  }
  button{ font: inherit; touch-action: manipulation; }
  svg{ flex-shrink:0; }
  h1, h2, h3, p, span, button, .tag, .chip{ overflow-wrap: break-word; }
  [hidden]{ display:none !important; }
  .hero, .cats, .subs, .list-wrap, .mapsec, footer{ position:relative; }

  /* Телефон и числа в RTL: всегда слева направо */
  html[dir="rtl"] .ltr-num{ direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:7px; }
  html[dir="rtl"] .ltr-num > span{ direction:ltr; unicode-bidi:isolate; }

  /* ============ Фон: глубокие орбы, сетка, парящая звезда ============ */
  .bg-deco{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.34; }
  .orb1{ width:520px; height:520px; top:-180px; inset-inline-start:-160px;
         background:radial-gradient(circle,#8A6A3B 0%,transparent 70%); }
  .orb2{ width:560px; height:560px; bottom:-220px; inset-inline-end:-180px;
         background:radial-gradient(circle,#2C4A66 0%,transparent 70%); opacity:.5; }
  .bg-grid{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(126,138,161,.16) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.4) 45%,transparent 78%);
            mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.4) 45%,transparent 78%);
  }
  .moon-wrap{
    position:absolute; top:70px; inset-inline-end:6%;
    width:64px; height:64px; will-change:transform;
  }
  .moon{
    width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle at 38% 34%, #F6E3B8, var(--accent) 78%);
    filter: drop-shadow(0 0 22px rgba(194,146,79,.55)) drop-shadow(0 0 70px rgba(194,146,79,.28));
    animation: floaty 9s ease-in-out infinite;
    opacity:.85;
  }
  .tw{ position:absolute; width:4px; height:4px; border-radius:50%;
       background:#E8CB9C; box-shadow:0 0 8px 2px rgba(232,203,156,.5);
       animation: twinkle 3.2s ease-in-out infinite; }
  .tw1{ top:12%; inset-inline-start:28%; }
  .tw2{ top:32%; inset-inline-start:56%; animation-delay:-1.1s; }
  .tw3{ top:70%; inset-inline-start:16%; animation-delay:-2.2s; width:5px; height:5px; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.7); }
    50%{ opacity:.9; transform:scale(1.15); }
  }

  /* ============ Эмблема-звезда в hero (8-конечная, фирменная) ============ */
  .hero-star{
    display:inline-flex; width:.92em; height:.92em;
    animation: starSpin 42s linear infinite;
    filter: drop-shadow(0 0 18px rgba(194,146,79,.5));
    will-change:transform;
  }
  .hero-star svg{ width:100%; height:100%; display:block; }
  @keyframes starSpin{ to{ transform:rotate(360deg); } }

  /* ============ Шапка ============ */
  .topbar{
    position: sticky; top:0; z-index:50;
    background: var(--bar-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line-soft);
    display:flex; align-items:center; gap:10px;
    height:60px; padding:0 clamp(12px, 3vw, 24px);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:1.02rem; letter-spacing:.1em; color:var(--card);
    text-decoration:none; white-space:nowrap;
    min-width:0;
  }
  .brand svg{ color: var(--accent-hi); filter: drop-shadow(0 0 8px rgba(194,146,79,.45)); }
  .brand-sub{
    font-family:'Noto Kufi Arabic',sans-serif;
    font-weight:400; font-size:.78rem; color:var(--muted);
    letter-spacing:0; align-self:flex-end; padding-bottom:2px;
  }
  html[dir="rtl"] .brand{ font-family:'Golos Text',sans-serif; }
  #settingsBtn{ margin-inline-start:auto; }
  .btn-gear{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; position:relative;
    background:var(--surface); border:1px solid var(--line-soft); color:var(--card);
    border-radius:12px; cursor:pointer; flex-shrink:0;
    transition: border-color .2s, color .2s, background .2s;
    touch-action: manipulation;
  }
  .btn-gear:hover{ border-color:var(--accent); color:var(--accent-hi); background:var(--hover-tint); }
  .btn-gear:active{ transform:scale(.94); }
  .btn-gear svg{ transition: transform .5s ease; }
  .btn-gear:hover svg{ transform: rotate(60deg); }
  .btn-gear .mini-badge{
    position:absolute; top:-5px; inset-inline-end:-5px;
    min-width:17px; height:17px; padding:0 4px; border-radius:99px;
    background:#E0645C; color:#fff; border:2px solid var(--bg);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.6rem; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .btn-sub{
    display:inline-flex; align-items:center; gap:7px;
    background: var(--gold-grad);
    color:var(--on-accent); border:none;
    border-radius:12px; padding:8px 14px; font-size:.8rem; font-weight:800;
    cursor:pointer; white-space:nowrap; touch-action: manipulation; flex-shrink:0;
    box-shadow: 0 8px 20px -8px rgba(194,146,79,.6);
    transition: filter .2s, transform .18s, box-shadow .18s;
  }
  .btn-sub:hover{ filter: brightness(1.08); }
  .btn-sub:active{ transform: translateY(2px); filter: brightness(.95); }
  .btn-admin{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--accent); color:var(--accent-hi);
    border-radius:12px; padding:8px 15px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition: background .2s, transform .18s, box-shadow .18s;
    white-space:nowrap; touch-action: manipulation; flex-shrink:0;
  }
  .btn-admin:hover{ background: var(--hover-tint); }
  .btn-admin:active{ transform: scale(.96); }

  /* ============ Hero ============ */
  .hero{ max-width: 980px; margin:0 auto; padding: 56px 24px 20px; }
  .hero-meta{
    color:var(--muted); font-size:.7rem; font-weight:600;
    letter-spacing:.28em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;
  }
  html[dir="rtl"] .hero-meta{ letter-spacing:0; }
  .hero-meta::after{ content:""; flex:1; height:1px;
    background:linear-gradient(90deg,var(--accent),transparent); opacity:.5; }
  .hero h1{
    font-size: clamp(2rem, 4.6vw, 3.2rem);
    font-weight:800; line-height:1.16; margin:14px 0 4px;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .hero h1 em{ font-style:normal;
    background:var(--gold-grad);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; }
  .hero-alt{
    color:var(--muted); font-size:1rem; font-weight:600;
    border-inline-start:3px solid var(--accent);
    padding-inline-start:12px; margin-top:6px;
  }
  html[dir="ltr"] .hero-alt{ font-family:'Noto Kufi Arabic',sans-serif; }
  .hero-desc{
    color:var(--card); opacity:.74; max-width:560px;
    margin-top:16px; line-height:1.65; font-size:.97rem;
  }
  .search{
    display:flex; align-items:center; gap:11px;
    max-width:560px; margin-top:24px;
    border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; background: var(--surface);
    transition: border-color .2s, box-shadow .25s;
  }
  .search:focus-within{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(194,146,79,.18); }
  .search.live{ animation: searchPulse .9s ease-in-out infinite; }
  @keyframes searchPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(194,146,79,.4); }
    50%{ box-shadow: 0 0 0 6px rgba(194,146,79,0); }
  }
  .search svg{ color: var(--muted); transition: color .25s; }
  .search.live svg{ color: var(--accent-hi); animation: wobble 1s ease-in-out infinite; }
  @keyframes wobble{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(10deg); }
  }
  .search input{
    flex:1; background:none; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.98rem; min-width:0;
  }
  .search input::placeholder{ color:var(--muted); }

  /* ============ Категории ============ */
  .cats{
    max-width:980px; margin:28px auto 0; padding:0 24px;
    display:flex; gap:9px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
    touch-action: pan-x manipulation;
    -webkit-overflow-scrolling: touch;
    padding-bottom:4px;
  }
  .cat-pill{
    flex-shrink:0; display:inline-flex; align-items:center; gap:9px;
    border:1px solid var(--line-soft); border-radius:999px;
    background:var(--surface); color:var(--card);
    padding:9px 17px; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .cat-pill .cnt{ font-size:.72rem; color:var(--muted); font-weight:500; }
  .cat-pill:hover{ border-color: var(--accent); }
  .cat-pill.on{
    background: var(--gold-grad);
    border-color:transparent; color:var(--on-accent);
    box-shadow: 0 10px 24px -8px rgba(194,146,79,.55);
  }
  .cat-pill.on .cnt{ color:var(--on-accent); opacity:.72; }
  .cat-pill:active{ transform: translateY(2px); }
  .cat-pill.anim{ animation: fadeUp .45s backwards; }
  .cat-pill .cnt{ background:rgba(126,138,161,.16); border-radius:99px; padding:2px 8px; }
  .cat-pill.on .cnt{ background:rgba(26,19,10,.18); }
  .cat-pill .cic{ display:inline-flex; color:var(--accent-hi); }
  .cat-pill.on .cic{ color:var(--on-accent); }
  .cic svg{ display:block; }

  /* ============ Выбор города ============ */
  .cities{ max-width:980px; margin:28px auto 0; padding:0 24px; }
  .cities-head{ display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .cities-head h2{
    font-size: clamp(1.2rem, 2.8vw, 1.55rem); font-weight:800;
    display:flex; align-items:center; gap:10px;
  }
  .cities-head h2 svg{ color:var(--accent-hi); filter: drop-shadow(0 0 8px rgba(194,146,79,.35)); }
  .cities-sub{ color:var(--muted); font-size:.84rem; font-weight:500; }
  .city-grid{
    display:grid; gap:9px;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  }
  .city-card{
    display:flex; flex-direction:column; gap:3px;
    background: var(--surface);
    border:1px solid var(--line-soft); border-radius:14px;
    padding:11px 13px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .5s backwards;
    min-width:0;
  }
  .city-card .cc-top{ display:flex; align-items:center; gap:8px; min-width:0; }
  .city-card .cc-pin{ color:var(--muted); transition: color .2s; flex-shrink:0; display:inline-flex; }
  .city-card .cc-name{
    font-size:.9rem; font-weight:700; color:var(--card);
    line-height:1.25; min-width:0; overflow-wrap: break-word;
  }
  .city-card .cc-cnt{
    font-size:.66rem; color:var(--accent-hi); font-weight:700;
    margin-inline-start:auto; opacity:.9; flex-shrink:0;
  }
  .city-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
    background: var(--hover-tint);
  }
  .city-card:hover .cc-pin{ color: var(--accent-hi); }
  .city-card:active{ transform: translateY(1px); }
  .city-card.on{
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(194,146,79,.16), rgba(194,146,79,.05));
    box-shadow: 0 8px 24px -12px rgba(194,146,79,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .city-card.on .cc-name{ color: var(--accent-hi); }
  .city-card.on .cc-pin{ color: var(--accent); }
  .no-city{ display:none !important; }
  #cats{ scroll-margin-top:76px; }

  /* ============ Подкатегории ============ */
  .subs{ max-width:980px; margin:14px auto 0; padding:0 24px; display:block; }
  .chip{
    background:var(--surface); border:1px solid var(--line-soft); color:var(--card);
    border-radius:999px; padding:6px 13px;
    font-size:.8rem; font-weight:500; cursor:pointer;
    transition: border-color .2s, color .2s, background .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{
    border-color:var(--accent); color:var(--accent-hi);
    background:rgba(194,146,79,.13); font-weight:700;
    box-shadow: 0 3px 10px -4px rgba(194,146,79,.4);
  }
  .chip:active{ transform: scale(.96); }

  .level-cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
    gap:9px; margin-top:6px;
    width:100%;
  }
  .level-card{
    display:flex; flex-direction:column; gap:2px;
    background: var(--surface);
    border:1px solid var(--line-soft); border-radius:14px;
    padding:10px 12px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s backwards;
    min-width:0;
  }
  .level-card .lc-top{ display:flex; align-items:center; gap:7px; min-width:0; }
  .level-card .lc-arrow{
    margin-inline-start:auto; color:var(--muted);
    transition: transform .2s, color .2s;
    opacity:.7;
  }
  .level-card .lc-title{ font-size:.88rem; font-weight:700; color:var(--card); line-height:1.22; min-width:0; }
  .level-card .lc-sub{ font-size:.66rem; color:var(--muted); font-weight:500; }
  .level-card .lc-cnt{
    font-size:.64rem; color:var(--accent-hi); font-weight:700;
    display:inline-block; margin-top:3px;
  }
  .level-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
    background: var(--hover-tint);
  }
  .level-card:hover .lc-arrow{ color: var(--accent-hi); transform: translateX(3px); }
  html[dir="rtl"] .level-card:hover .lc-arrow{ transform: translateX(-3px); }
  .level-card.on{
    border-color: var(--accent);
    background: rgba(194,146,79,.1);
    box-shadow: 0 5px 18px -10px rgba(194,146,79,.45), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .level-card.on .lc-title{ color: var(--accent-hi); }
  .level-card.on .lc-arrow{ color: var(--accent-hi); }

  .subjects-block{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line-soft);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    animation: fadeUp .4s backwards;
  }
  .subjects-title{
    display:flex; align-items:center; gap:10px;
    font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
    flex-basis:100%; margin-bottom:2px;
  }
  html[dir="rtl"] .subjects-title{ text-transform:none; letter-spacing:0; }
  .subjects-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .subjects-title svg{ color: var(--accent); }

  .btn-add{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    background: var(--gold-grad);
    color:var(--on-accent); border:none;
    border-radius:12px; padding:9px 16px;
    font-size:.85rem; font-weight:700; cursor:pointer;
    box-shadow: 0 8px 20px -8px rgba(194,146,79,.55);
    transition: filter .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
  }
  .btn-add:hover{ filter: brightness(1.08); }
  .btn-add:active{ transform: translateY(2px); filter:brightness(.95); }
  .btn-add.hidden{ display:none; }

  /* ============ Список: плавающие карточки ============ */
  .list-wrap{ max-width:980px; margin:34px auto 40px; padding:0 24px; }
  .list-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-soft);
  }
  .list-head h2{ font-size: clamp(1.35rem, 3vw, 1.8rem); font-weight:800; }
  .list-head .cnt{ color:var(--muted); font-size:.85rem; font-weight:600; }
  .conn{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  html[dir="rtl"] .conn{ text-transform:none; letter-spacing:0; }
  .conn .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    transition: background .3s;
  }
  .conn.online .dot{ background: var(--accent); animation: pulse 2.2s infinite; }
  .conn.cache  .dot{ background: var(--accent2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(194,146,79,.55); }
    50%{ box-shadow:0 0 0 5px rgba(194,146,79,0); }
  }

  .sheet{
    background:transparent; color:inherit;
    border-radius:0; overflow:visible; margin-top:16px;
    border:none; box-shadow:none;
    display:flex; flex-direction:column; gap:12px;
  }
  .row{
    display:grid;
    grid-template-columns: 56px minmax(0,1fr) auto;
    gap: 8px 18px;
    padding: 20px;
    background: var(--panel);
    color: var(--panel-text);
    border:1px solid var(--line-soft);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    position:relative;
    overflow:hidden;
    animation: fadeUp .45s backwards;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    cursor:pointer;
  }
  .row::after{
    content:""; position:absolute; top:0; inset-inline-start:0; width:100%; height:2px;
    background:var(--gold-grad); opacity:0; transition:opacity .25s;
  }
  .row:hover{
    transform: translateY(-3px);
    border-color: rgba(194,146,79,.4);
    box-shadow: 0 22px 48px -22px rgba(0,0,0,.65);
  }
  .row:hover::after{ opacity:1; }
  .num{
    font-weight:800; font-size:1.3rem;
    padding-top:2px;
    background:linear-gradient(180deg,var(--accent-hi) 15%,var(--accent-lo) 90%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .row-body{ min-width:0; }
  .row-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row-top h3{ font-size:1.1rem; font-weight:700; line-height:1.3; color:var(--panel-text); }
  .tag{
    background: rgba(194,146,79,.14); color: var(--accent-hi);
    border:1px solid rgba(194,146,79,.3);
    font-size:.67rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:7px; white-space:nowrap;
  }
  html[dir="rtl"] .tag{ text-transform:none; letter-spacing:0; }
  .row-desc{
    color:var(--muted); font-size:.9rem; line-height:1.55; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-meta{ display:flex; flex-wrap:wrap; gap:7px 22px; margin-top:12px; font-size:.89rem; }
  .row-meta span{ display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .row-meta svg{ color: var(--accent); }
  .row-meta .loc{ color:var(--muted); }
  .row-meta [data-rate-badge] svg{ fill:currentColor; }
  .row-actions{
    display:flex; flex-direction:column; gap:9px; justify-content:center; align-items:stretch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:12px; padding:9px 15px;
    background:transparent; -webkit-appearance:none; appearance:none;
    font-size:.83rem; font-weight:700; cursor:pointer;
    text-decoration:none; border:1px solid transparent;
    transition: filter .2s, background .2s, transform .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-solid{
    background: var(--gold-grad);
    color:var(--on-accent);
    box-shadow: 0 8px 20px -8px rgba(194,146,79,.5);
  }
  .btn-solid:hover{ filter:brightness(1.08); }
  .btn-outline{ background:transparent; border-color:var(--line); color:var(--panel-text); }
  .btn-outline:hover{ background:var(--hover-tint); border-color:var(--accent); }
  .btn-danger{ background:transparent; border-color:rgba(224,122,108,.5); color:#E07A6C; }
  .btn-danger:hover{ background:rgba(224,122,108,.12); }
  .empty{ padding:56px 24px; text-align:center; color:var(--muted); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty h4{ color:var(--card); font-weight:700; margin-bottom:6px; font-size:1.05rem; }
  .empty p{ font-size:.9rem; max-width:340px; margin:0 auto; line-height:1.6; }

  .detail-tag{ display:inline-block; margin-bottom:12px; }
  .detail-desc{ color:var(--muted); line-height:1.6; margin:6px 0 14px; font-size:.95rem; }
  .detail-meta{ display:flex; flex-direction:column; gap:9px; margin:14px 0 16px; font-size:.95rem; }
  .detail-meta span{ display:inline-flex; align-items:center; gap:9px; }
  .detail-meta svg{ color: var(--muted); }
  .detail-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .detail-actions .btn{ flex:1; min-width:130px; }
  .views-admin{ display:flex; align-items:center; gap:9px; margin-top:12px; padding:8px 10px;
    border:1px dashed rgba(194,146,79,.5); border-radius:12px; }
  .views-admin-l{ display:inline-flex; align-items:center; gap:7px; font-size:.83rem; font-weight:700; color:var(--muted); white-space:nowrap; }
  .views-admin-l svg{ color: var(--accent); }
  .views-admin input{ width:86px; flex:0 0 auto; background: var(--input-bg); color: var(--panel-text);
    border:1px solid var(--line-soft); border-radius:10px; padding:8px 10px; font:inherit; font-size:15px;
    outline:none; }
  .views-admin input:focus{ border-color: var(--accent); }
  .views-dec-btn{ display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:#E07A6C; border:1px solid rgba(224,122,108,.5);
    border-radius:10px; padding:8px 12px; font:inherit; font-weight:700; cursor:pointer;
    transition: background .2s, transform .18s; }
  .views-dec-btn:hover{ background: rgba(224,122,108,.12); }

  /* ============ v1.3.0 · Рейтинг в карточке ============ */
  .rate-box{
    border:1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding:12px 14px;
    background: rgba(194,146,79,.06);
    margin:0 0 16px;
  }
  .rate-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .rate-title{ display:inline-flex; gap:7px; align-items:center; font-size:.86rem; font-weight:700; color:var(--panel-text); }
  .rate-title svg{ color:var(--accent-hi); fill:var(--accent-hi); }
  .rate-sum{ color:var(--accent-hi); font-weight:800; font-size:.9rem; }
  .rate-stars{ display:flex; gap:4px; }
  .rate-star{
    background:none; border:none; cursor:pointer;
    color:rgba(126,138,161,.42);
    padding:2px; transition: transform .15s, color .15s;
    touch-action: manipulation;
  }
  .rate-star svg{ fill:currentColor; }
  .rate-star:hover{ color:var(--accent); }
  .rate-star.on{ color:var(--accent-hi); }
  .rate-star:active{ transform: scale(1.25); }

  /* ============ v1.3.0 · Карта (Leaflet + OSM) ============ */
  .mapsec{ max-width:980px; margin:26px auto 0; padding:0 24px; }
  .map-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .map-head h2{ font-size:clamp(1.15rem,2.6vw,1.5rem); font-weight:800; display:flex; align-items:center; gap:10px; }
  .map-head h2 svg{ color:var(--accent-hi); }
  .map-tools{ margin-inline-start:auto; display:flex; gap:8px; }
  .map-tools .chip{ display:inline-flex; align-items:center; gap:7px; }
  .map-tools .chip svg{ color:var(--accent-hi); }
  .map-hint{ color:var(--muted); font-size:.8rem; line-height:1.55; margin-bottom:10px; }
  .map-shell{
    height:440px; border-radius: var(--r-lg); overflow:hidden;
    border:1px solid var(--line-soft);
    position:relative; background:var(--bg2);
    box-shadow: var(--shadow-card);
  }
  #mapCanvas{ position:absolute; inset:0; }
  .map-shell .leaflet-tile{ filter:brightness(.82) saturate(.72) contrast(1.06); }
  html[data-theme="light"] .map-shell .leaflet-tile{ filter:none; }
  .leaflet-container{ font-family:inherit; background:var(--bg2); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{ background:var(--panel); color:var(--panel-text); }
  .leaflet-popup-content-wrapper{ border-radius:14px; border:1px solid var(--line-soft); box-shadow:var(--shadow-pop); }
  .leaflet-popup-content{ margin:12px 14px; }
  .map-pop{ display:flex; flex-direction:column; gap:6px; min-width:150px; }
  .map-pop b{ font-size:.9rem; line-height:1.35; }
  .map-pop .map-pop-city{ font-size:.74rem; color:var(--muted); display:inline-flex; align-items:center; gap:5px; }
  .map-pop .map-pop-city svg{ color:var(--accent); }
  /* v1.3.0 · Ручной ввод координат (форма + «рядом со мной») */
  .map-coord-row{ display:flex; gap:6px; margin-top:8px; align-items:stretch; }
  .map-coord-row input{
    flex:1; min-width:0; direction:ltr;
    background:var(--input-bg); color:var(--panel-text);
    border:1px solid var(--line-soft); border-radius:10px;
    padding:9px 10px; font:inherit; font-size:16px; outline:none;
    transition:border-color .2s;
  }
  .map-coord-row input:focus{ border-color:var(--accent); }
  .map-coord-row input::placeholder{ color:var(--muted); }
  .map-coord-row .btn{ flex:0 0 auto; padding:9px 14px; font-size:.8rem; }
  .map-pop-btn{ padding:7px 10px; font-size:.78rem; }
  .dalil-pin{
    width:30px; height:30px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    background:var(--pin-g, var(--gold-grad));
    border:1.5px solid rgba(255,255,255,.65);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.55);
  }
  .dalil-pin svg{ transform:rotate(45deg); color:#fff;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }

  /* Метка на карте в формах */
  .map-pick{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .map-pick .btn{ padding:8px 12px; font-size:.8rem; }
  .map-pick-val{ font-size:.8rem; color:var(--accent-hi); font-weight:700; }
  .map-pick-box{
    height:230px; border-radius:var(--r-md); overflow:hidden;
    border:1px solid var(--line-soft); margin-top:10px; position:relative;
    background:var(--bg2);
  }
  .map-pick-box > div{ position:absolute; inset:0; }
  .map-pick-hint{ font-size:.74rem; color:var(--muted); margin-top:7px; line-height:1.5; }

  /* ============ Модалка подписки ============ */
  .plans{ display:flex; gap:10px; margin-top:6px; }
  .plan{
    flex:1; display:flex; flex-direction:column; gap:6px;
    background: var(--surface);
    border:1px solid var(--line-soft); border-radius:16px;
    padding:16px 12px; cursor:pointer; text-align:center;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s backwards;
  }
  .plan:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
    background: var(--hover-tint);
  }
  .plan.on{
    background: var(--hover-tint);
    border:2px solid var(--accent);
    box-shadow: 0 8px 22px -10px rgba(194,146,79,.5);
  }
  .plan-name{ font-size:.82rem; font-weight:700; color:var(--panel-text); }
  .plan-price{
    font-size:1.45rem; font-weight:800; color: var(--accent-hi);
  }
  .plan-note{ font-size:.72rem; font-weight:600; color:var(--muted); }
  /* ===== v1.3.2 · Промо-ивент «1 месяц бесплатно» (красный, до 17.10.2026) =====
     После 17.10.2026 JS скрывает баннер и снимает класс .promo — стили спят. */
  .promo-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
    margin:14px auto 2px; padding:10px 18px;
    border-radius:14px; cursor:pointer; text-align:center;
    background: linear-gradient(135deg,#9E0E18,#D8281F 55%,#F0463A);
    border:1px solid rgba(255,130,118,.5);
    box-shadow: 0 10px 26px -12px rgba(216,40,31,.6), inset 0 1px 0 rgba(255,255,255,.16);
    color:#fff;
    animation: promoGlow 2.8s ease-in-out infinite;
  }
  .promo-bar .p-tag{
    font-size:.64rem; font-weight:900; letter-spacing:.14em;
    background:rgba(0,0,0,.3); padding:3px 9px; border-radius:8px;
    white-space:nowrap;
  }
  .promo-bar .p-text{ font-size:.86rem; font-weight:800; line-height:1.4; }
  @keyframes promoGlow{
    0%,100%{ box-shadow: 0 10px 26px -12px rgba(216,40,31,.55), inset 0 1px 0 rgba(255,255,255,.16); }
    50%{ box-shadow: 0 14px 34px -9px rgba(240,70,58,.85), inset 0 1px 0 rgba(255,255,255,.22); }
  }
  .plan.promo{
    border-color: rgba(232,72,60,.6);
    box-shadow: 0 8px 22px -12px rgba(232,72,60,.5);
  }
  .plan.promo.on{
    border-color:#E8483C;
    box-shadow: 0 8px 22px -10px rgba(232,72,60,.6);
  }
  .plan.promo .plan-price s{
    font-size:.92rem; font-weight:700; color:var(--muted); margin-inline-end:3px;
  }
  .plan.promo .plan-price b{ color:#FF6659; font-weight:900; }
  .plan-free{
    font-size:.6rem; font-weight:900; letter-spacing:.1em;
    color:#fff; background:linear-gradient(135deg,#B3121B,#E8483C);
    padding:3px 10px; border-radius:999px;
    align-self:center;
  }
  .agent-card{
    display:flex; align-items:center; gap:12px;
    margin-top:14px; padding:12px 14px;
    border:1px solid var(--line-soft); border-radius:14px;
    background: var(--surface);
  }
  .agent-ic{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(194,146,79,.16); color: var(--accent-hi);
    border:1px solid rgba(194,146,79,.4);
  }
  .agent-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .agent-name{ font-size:.76rem; font-weight:600; color:var(--muted); line-height:1.45; }
  .agent-phone{
    color: var(--accent-hi); font-weight:800; font-size:.98rem;
    text-decoration:none; direction:ltr; unicode-bidi:isolate;
    display:inline-flex; align-items:center; gap:7px;
    width:fit-content; letter-spacing:.02em;
    transition: filter .2s, transform .18s;
  }
  .agent-phone:hover{ filter:brightness(1.2); transform: translateY(-1px); }
  .sub-hint{
    margin-top:14px; font-size:.72rem; color:var(--muted);
    line-height:1.5; text-align:center;
  }

  /* ============ Мастер заявки ============ */
  .steps{ display:flex; gap:7px; margin-bottom:9px; }
  .step{
    flex:1; height:5px; border-radius:99px;
    background:var(--line-soft);
    transition: background .3s;
  }
  .step.on{ background: var(--accent); }
  .step.done{ background: rgba(194,146,79,.45); }
  .steps-cap{
    font-size:.74rem; font-weight:700; color:var(--muted);
    margin-bottom:18px; letter-spacing:.04em;
  }
  .app-pane{ animation: fadeUp .3s backwards; }
  .rules-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .rule{
    display:flex; gap:11px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:14px;
    padding:12px 14px;
  }
  .rule-num{
    width:24px; height:24px; border-radius:8px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(194,146,79,.16); color: var(--accent-hi);
    border:1px solid rgba(194,146,79,.4);
    font-weight:800; font-size:.78rem;
  }
  .rule p{ font-size:.86rem; color:var(--panel-text); line-height:1.5; margin:0; }
  .agree{
    position:relative; display:flex; gap:11px; align-items:flex-start; cursor:pointer;
    padding:13px 14px; border:1.5px dashed rgba(194,146,79,.55); border-radius:14px;
    background: rgba(194,146,79,.06);
    transition: background .2s, border-color .2s;
    user-select:none; -webkit-user-select:none; touch-action: manipulation;
  }
  .agree:hover{ background: rgba(194,146,79,.1); }
  .agree input{ position:absolute; opacity:0; pointer-events:none; }
  .agree-box{
    width:22px; height:22px; border-radius:7px; flex-shrink:0; margin-top:1px;
    border:2px solid var(--accent); background: transparent; color: transparent;
    display:inline-flex; align-items:center; justify-content:center;
    transition: background .2s, color .2s;
  }
  .agree.on{ border-style:solid; border-color:var(--accent); background:rgba(194,146,79,.12); }
  .agree.on .agree-box{ background: var(--accent); color:var(--on-accent); }
  .agree-text{ font-size:.85rem; font-weight:600; line-height:1.45; color:var(--panel-text); }
  .done-ic{
    width:64px; height:64px; margin:8px auto 14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(194,146,79,.15); color: var(--accent-hi);
    border:1px solid rgba(194,146,79,.5);
    animation: popIn .45s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes popIn{
    from{ transform:scale(.55); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .done-title{ text-align:center; font-size:1.12rem; font-weight:800; margin-bottom:8px; color:var(--panel-text); }
  .done-desc{ text-align:center; }
  .done-wa{ margin-top:2px; width:100%; justify-content:center; display:inline-flex; margin-bottom:11px; }

  /* ============ Очередь заявок / админ-карточки ============ */
  .reqs-badge{
    min-width:21px; height:21px; padding:0 6px; border-radius:99px;
    background:var(--gold-grad); color:var(--on-accent);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.74rem; font-weight:800;
  }
  .reqs-count{ font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:14px; }
  .reqs-list{ display:flex; flex-direction:column; gap:12px; }
  .req-card{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:16px;
    padding:14px 15px;
    animation: fadeUp .3s backwards;
  }
  .req-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .req-plan{
    font-size:.72rem; font-weight:800; color:var(--accent-hi);
    background:rgba(194,146,79,.14); border:1px solid rgba(194,146,79,.4);
    border-radius:99px; padding:3px 10px;
  }
  .req-date{ font-size:.7rem; color:var(--muted); margin-inline-start:auto; }
  .req-name{ font-size:.95rem; font-weight:800; color:var(--panel-text); line-height:1.35; }
  .req-meta{
    display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:7px;
    font-size:.76rem; color:var(--muted); font-weight:600;
  }
  .req-meta span{ display:inline-flex; align-items:center; gap:5px; min-width:0; }
  .req-meta svg{ color:var(--accent); }
  .req-desc{ margin-top:8px; font-size:.8rem; color:var(--panel-text); opacity:.85; line-height:1.5; }
  .req-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .req-actions .btn{ flex:1; min-width:104px; padding:9px 10px; font-size:.8rem; }
  @media (max-width:640px){
    .req-actions .btn{ min-width:96px; }
  }

  /* ============ Появление при скролле ============ */
  .reveal{ opacity:0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.vis{ opacity:1; transform:none; }

  /* ============ Футер ============ */
  footer{
    border-top:1px solid var(--line-soft);
    padding:26px 24px 40px; text-align:center;
    color:var(--muted); font-size:.8rem;
    line-height:1.7;
  }
  footer::before{
    content:""; position:absolute; top:-1px; left:12%; right:12%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(194,146,79,.6), transparent);
  }
  .footer-agent{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .fa-line{ color:var(--card); opacity:.88; font-weight:600; font-size:.85rem; }
  .fa-addr{ font-size:.75rem; opacity:.75; max-width:620px; margin:0 auto; line-height:1.75; }
  .footer-phone{
    display:inline-flex; align-items:center; gap:7px;
    color: var(--accent-hi); font-weight:700;
    text-decoration:none; font-size:1rem;
    direction:ltr; unicode-bidi:isolate;
    letter-spacing:.02em;
    transition: filter .2s, transform .18s;
  }
  .footer-phone:hover{ filter: brightness(1.25); text-decoration:underline; transform: translateY(-1px); }
  .footer-phone svg{ color: var(--accent); }
  .footer-note{ margin-top:16px; font-size:.72rem; opacity:.7; }
  .ver-line{ margin-top:14px; display:flex; justify-content:center; }
  .ver-badge{
    font-size:.72rem; font-weight:600; letter-spacing:.12em;
    color:var(--muted);
    border:1px solid var(--line-soft); border-radius:999px;
    padding:3px 12px; opacity:.85;
    font-variant-numeric: tabular-nums;
  }

  /* ============ Плавающая кнопка «Админ-панель» ============ */
  .float-panel{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    z-index:60; display:none;
    align-items:center; gap:9px;
    background: linear-gradient(180deg, #4E8FA8, #376E85);
    color:#fff;
    border:none; border-radius:999px;
    padding:13px 22px; font-weight:700; font-size:.9rem; cursor:pointer;
    box-shadow: 0 4px 0 #27566B, 0 16px 34px -6px rgba(0,0,0,.55);
    transition: filter .2s, transform .18s, box-shadow .18s;
    touch-action: manipulation;
    max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .float-panel:hover{ filter:brightness(1.1); }
  .float-panel:active{ transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #27566B; }
  .float-panel.show{ display:inline-flex; animation: fadeUp .35s backwards; }
  .float-panel svg{ flex:none; color:#fff; }
  html[data-theme="light"] .float-panel{
    background: linear-gradient(180deg,#4f93a3,#407e8c);
    box-shadow: 0 4px 0 #2e5f6d, 0 16px 34px -6px rgba(8,58,79,.45);
  }

  /* ============ Админ-панель ============ */
  .adm-modal{
    max-width:660px; display:flex; flex-direction:column;
    height:min(90vh, 780px);
  }
  .adm-modal .modal-head{ flex:none; }
  .adm-modal .adm-stats{ flex:none; }
  .adm-stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:4px 0 12px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:14px;
    padding:12px 6px 10px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    animation: fadeUp .3s backwards;
  }
  .stat-num{ font-size:1.4rem; font-weight:800; color:var(--accent-hi); line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat-num.hot{ color:#E8B15C; }
  .stat-lbl{ font-size:.64rem; color:var(--muted); font-weight:700; line-height:1.25; }
  .adm-tabs{ display:flex; flex-wrap:wrap; gap:7px; padding-bottom:6px; margin-bottom:4px; }
  .adm-tab{
    position:relative; display:inline-flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--line-soft); color:var(--muted);
    border-radius:999px; padding:9px 14px;
    font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap;
    transition: color .18s, border-color .18s, background .18s;
    font-family:inherit;
  }
  .adm-tab:hover{ color:var(--accent-hi); }
  .adm-tab.on{ color:var(--accent-hi); border-color:rgba(194,146,79,.65); background:rgba(194,146,79,.12); }
  .adm-badge{
    min-width:19px; height:19px; padding:0 5px; border-radius:99px;
    background:var(--accent); color:var(--on-accent);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.7rem; font-weight:800;
  }
  .adm-pane{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:12px; padding:2px; }
  .adm-view{ display:flex; flex-direction:column; gap:12px; }
  .adm-search{
    display:flex; align-items:center; gap:9px;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:14px;
    padding:11px 13px; color:var(--muted);
  }
  .adm-search svg{ color:var(--accent); }
  .adm-search input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--panel-text); font:inherit; font-size:.9rem;
  }
  .adm-doc{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:16px;
    padding:12px 13px;
    animation: fadeUp .3s backwards;
  }
  .adm-doc-top{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }
  .adm-doc-name{ font-size:.93rem; font-weight:800; color:var(--panel-text); line-height:1.35; word-break:break-word; }
  .ttl-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.68rem; font-weight:800; border-radius:99px; padding:3px 9px;
    margin-inline-start:auto;
  }
  .ttl-ok{ color:#7FC98F; background:rgba(85,149,95,.14); border:1px solid rgba(85,149,95,.45); }
  .ttl-warn{ color:#E8B15C; background:rgba(201,154,75,.15); border:1px solid rgba(201,154,75,.45); }
  .ttl-dead{ color:#E07A6C; background:rgba(224,122,108,.13); border:1px solid rgba(224,122,108,.45); }
  .adm-doc-actions{ display:flex; gap:7px; margin-top:11px; flex-wrap:wrap; }
  .adm-doc-actions .btn{ flex:none; padding:7px 11px; font-size:.75rem; }
  .btn-renew{ color:#7FC98F; border-color:rgba(85,149,95,.5); }
  .btn-renew:hover{ background:rgba(85,149,95,.12); }
  .tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .tool-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:7px;
    background:var(--surface); border:1px solid var(--line-soft); border-radius:16px;
    padding:14px; cursor:pointer; color:var(--panel-text); text-align:start;
    font-family:inherit; transition: border-color .18s, filter .18s;
  }
  .tool-btn:hover{ border-color:rgba(194,146,79,.55); filter:brightness(1.06); }
  .tool-btn:active{ transform:scale(.98); }
  .tool-btn svg{ color:var(--accent-hi); }
  .tool-btn .tt{ font-weight:800; font-size:.84rem; line-height:1.3; }
  .tool-btn .td{ font-size:.7rem; color:var(--muted); line-height:1.4; }
  .tool-btn.danger .tt{ color:#E07A6C; }

  /* ============ Избранное и сортировка в списке ============ */
  .list-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0 2px; }
  .chip-fav svg{ color:#E0645C; }
  .chip-fav.fav-on{ color:#E0645C; border-color:rgba(224,100,92,.55); background:rgba(224,100,92,.1); }
  .sort-sep{ width:1px; height:18px; background:var(--line); }
  .btn-sq{ padding:9px 11px; }
  .row-fav, .detail-fav{ color:var(--muted); }
  .row-fav.fav-on, .detail-fav.fav-on{ color:#E0645C; border-color:rgba(224,100,92,.55); }
  .row-fav.fav-on svg path, .detail-fav.fav-on svg path{ fill:currentColor; }

  /* ============ Жалоба на анкету ============ */
  .rep-reasons{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .rep-reason{
    background:var(--surface); color:var(--panel-text);
    border:1px solid var(--line);
    font-weight:600; padding:8px 14px;
  }
  .rep-reason:hover{ border-color:var(--accent); color:var(--accent-hi); }
  .rep-reason.on{ color:var(--accent-hi); border-color:rgba(194,146,79,.65); background:rgba(194,146,79,.12); }

  /* ============ Напоминания ============ */
  .rem-warn{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.72rem; font-weight:800; color:#E8B15C;
    background:rgba(201,154,75,.15); border:1px solid rgba(201,154,75,.45);
    border-radius:99px; padding:3px 10px;
  }

  /* ============ v1.3.0 · Мобильные WebView: стабилизация ============
     Мерцание, лаги и «исчезающие» кнопки на телефонах дают: blur
     (backdrop-filter), тяжёлые blur-орбы фона и repaint фиксированных
     панелей при скролле. На узких экранах всё это отключаем — плюс
     reveal-блоки видимы сразу (если IntersectionObserver не сработал,
     контент больше не остаётся невидимым). */
  @media (max-width: 820px){
    .topbar, .bottom-nav, .overlay, .overlay .modal{
      backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
    }
    .topbar, .bottom-nav{ background:var(--bar-bg, #101623); }
    .orb{ filter:blur(60px); opacity:.2; animation:none !important; }
    .bottom-nav{ transform:translateX(-50%) translateZ(0); }
    .reveal{ opacity:1; transform:none; transition:none; }
    *{ -webkit-tap-highlight-color:transparent; }
    /* v1.3.1: body{overscroll-behavior-y:contain} УДАЛЁН — в паре с
       body{overflow-x:hidden} он запирал тач-скролл контента (жест умирал
       в body, не доходя до вьюпорта). Перенесён на html (см. выше). */
  }

  /* ============ v1.3.0 · Нижняя навигация-док ============ */
  .bottom-nav{
    position:fixed; bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    left:50%; transform:translateX(-50%);
    z-index:80;
    display:flex; gap:4px; align-items:stretch;
    width:min(94vw, 540px);
    background:var(--bar-bg);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--line-soft);
    border-radius:24px;
    padding:8px 10px;
    box-shadow: 0 20px 50px -14px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .bn-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted);
    font-size:.6rem; font-weight:700; padding:7px 2px 5px;
    border-radius:14px; cursor:pointer; position:relative;
    transition: color .2s, background .2s;
    touch-action: manipulation; min-width:0;
    font-family:inherit;
  }
  .bn-item .bn-ic{ display:inline-flex; }
  .bn-item svg{ width:21px; height:21px; }
  .bn-item.on{ color:var(--accent-hi); background:rgba(194,146,79,.1); }
  .bn-item:active{ transform:scale(.94); }
  .bn-badge{
    position:absolute; top:2px; inset-inline-end:calc(50% - 20px);
    min-width:16px; height:16px; padding:0 4px; border-radius:99px;
    background:#E0645C; color:#fff; border:2px solid var(--bg);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.58rem; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .bn-fab{
    flex:1.15; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--accent-hi);
    font-size:.6rem; font-weight:800; padding:0 2px 5px;
    cursor:pointer; position:relative;
    touch-action: manipulation; min-width:0;
    font-family:inherit;
  }
  .bn-fab .fab-disc{
    width:47px; height:47px; border-radius:50%;
    background:var(--gold-grad);
    display:flex; align-items:center; justify-content:center;
    color:var(--on-accent);
    box-shadow:0 12px 26px -8px rgba(194,146,79,.65), 0 2px 0 var(--accent-lo), inset 0 1px 0 rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.28);
    margin-top:-24px;
    transition: filter .2s, transform .18s;
  }
  .bn-fab:active .fab-disc{ transform:translateY(2px); filter:brightness(.95); }
  .bn-fab .bn-t, .bn-item .bn-t{
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ============ v1.3.0 · Центр уведомлений ============ */
  .notif-list{ display:flex; flex-direction:column; gap:10px; }
  .notif-item{
    display:flex; gap:12px; align-items:flex-start;
    padding:13px 14px;
    background:var(--surface);
    border:1px solid var(--line-soft);
    border-radius:16px;
    animation: fadeUp .3s backwards;
    position:relative;
  }
  .notif-item.unread{ border-color:rgba(194,146,79,.45); background:rgba(194,146,79,.07); }
  .notif-item.unread::before{
    content:""; position:absolute; top:12px; inset-inline-end:12px;
    width:8px; height:8px; border-radius:50%;
    background:var(--accent-hi); box-shadow:0 0 8px rgba(194,146,79,.8);
  }
  .ni-ic{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(194,146,79,.14); color:var(--accent-hi);
    border:1px solid rgba(194,146,79,.35);
  }
  .ni-body{ display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
  .ni-top{ display:flex; align-items:baseline; gap:10px; }
  .ni-top b{ font-size:.88rem; color:var(--panel-text); line-height:1.3; }
  .ni-time{ margin-inline-start:auto; font-size:.68rem; color:var(--muted); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .ni-desc{ font-size:.82rem; color:var(--muted); line-height:1.5; }
  .ni-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; }
  .ni-actions .btn{ padding:7px 12px; font-size:.76rem; }
  .notif-empty{
    padding:44px 20px; text-align:center; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .notif-empty svg{ opacity:.5; }

  /* ============ Тосты ============ */
  #toastWrap{
    position:fixed; top:74px; left:50%; transform:translateX(-50%);
    z-index:10050;
    display:flex; flex-direction:column; gap:9px; align-items:center;
    pointer-events:none; width:min(92vw, 480px);
  }
  .toast{
    background:var(--panel); color:var(--panel-text);
    border:1px solid var(--line-soft);
    border-inline-start:4px solid var(--accent);
    border-radius:12px; padding:13px 20px;
    font-size:.9rem; font-weight:600;
    box-shadow: var(--shadow-pop);
    animation: fadeUp .3s backwards; max-width:100%;
    word-break: break-word;
  }
  .toast.err{ border-inline-start-color: #E07A6C; }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }

  /* ============ Волны под списком ============ */
  .dunes{
    position:relative; height:190px; margin-top:6px;
    overflow:hidden; pointer-events:none; user-select:none;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 80%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 80%,transparent 100%);
  }
  .dune{ position:absolute; top:0; inset-inline-start:0; width:200%; height:100%; }
  .dunes .d1{ animation:duneMove 17s linear infinite; }
  .dunes .d2{ animation:duneMove 26s linear infinite reverse; }
  .dunes .d3{ animation:duneMove 35s linear infinite; }
  .dunes .d4{ animation:duneMove 21s linear infinite reverse; }
  @keyframes duneMove{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  html[data-theme="light"] .dunes .d1{ opacity:.75; }
  html[data-theme="light"] .dunes .d3{ opacity:.8; }

  /* ============ Модальные окна ============ */
  .overlay{
    position:fixed; inset:0;
    z-index:9999;
    background:var(--overlay-bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition: opacity .28s;
    touch-action: manipulation;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--panel); color:var(--panel-text);
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:22px; padding:28px 26px;
    border:1px solid var(--line-soft);
    transform: translateY(16px) scale(.96);
    transition: transform .28s;
    box-shadow: var(--shadow-pop);
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show .modal{ transform:none; }
  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; padding-bottom:11px; border-bottom:1px solid var(--line-soft); }
  .modal-head h3{ font-size:1.25rem; font-weight:800; flex:1; line-height:1.25; color:var(--panel-text); }
  .modal-close{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:9px; border-radius:10px; display:flex; flex-shrink:0;
    touch-action: manipulation;
    transition: background .2s, color .2s, transform .25s;
  }
  .modal-close:hover{ color:#E07A6C; background:var(--surface); }
  .modal-close:active{ transform: scale(.92); }
  .modal-back{
    background:rgba(194,146,79,.12); color:var(--panel-text);
    border:1px solid var(--accent); border-radius:10px;
    padding:7px 14px 7px 10px; font-weight:700; font-size:.8rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    margin-bottom:14px;
    touch-action: manipulation;
    transition: background .2s, transform .15s;
  }
  .modal-back:hover{ background:rgba(194,146,79,.22); }
  .modal-back:active{ transform: scale(.96); }
  html[dir="rtl"] .modal-back{ padding:7px 10px 7px 14px; }
  .modal-desc{ color:var(--muted); font-size:.9rem; line-height:1.55; margin-bottom:22px; }

  .field{ margin-bottom:17px; }
  .field label{
    display:block; font-size:.72rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  html[dir="rtl"] .field label{ text-transform:none; }
  .field label .req{ color: #E07A6C; }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--input-bg); color: var(--panel-text);
    border:1px solid var(--line-soft); border-radius:12px;
    padding:12px 14px; font:inherit; font-size:16px;
    outline:none; transition: border-color .2s, box-shadow .2s;
    touch-action: manipulation;
  }
  .field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(194,146,79,.18);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted); }
  .field select{ appearance:none; cursor:pointer; }
  .field select option{ background:var(--panel2); color:var(--panel-text); }
  html[data-theme="light"] .field select option{ background:#FCF8F1; color:#22303C; }
  .counter{ text-align:end; font-size:.72rem; color:var(--muted); margin-top:5px; }
  .counter.over{ color:#E07A6C; font-weight:700; }

  /* ============ Маршруты (перевозки) ============ */
  .route-pick{ display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  .route-pick .chip{
    padding:5px 12px; font-size:.78rem;
    color:var(--panel-text); font-weight:600;
    background:var(--surface); border-color:var(--line);
  }
  .route-pick .chip:hover{ color:var(--accent-hi); }
  .route-pick .chip.on{ color:var(--accent-hi); }
  .dest-filter{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0 2px; }
  .dest-label{ font-size:.8rem; color:var(--muted); font-weight:700; }
  .modal-actions{ display:flex; gap:11px; margin-top:24px; }
  .modal-actions .btn{ flex:1; padding:13px; font-size:.92rem; }

  .modal-submit{
    width:100%; margin-top:4px; padding:15px; font-size:1rem !important;
    touch-action: manipulation;
    min-height:52px;
  }
  .modal-submit:active{ transform: scale(.98); filter:brightness(1.15); }
  .modal-submit[disabled]{ opacity:.55; pointer-events:none; }

  .err-banner{
    display:none;
    background: rgba(224,122,108,.16); color: #F0A294;
    border:1px solid rgba(224,122,108,.45);
    border-radius:12px; padding:12px 16px;
    font-size:.88rem; font-weight:700;
    margin-bottom:18px; text-align:center;
    word-break: break-word;
  }
  .err-banner.show{ display:block; animation: fadeUp .3s backwards; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============ Настройки ============ */
  .set-block{ margin-bottom:20px; }
  .set-label{
    display:flex; align-items:center; gap:8px;
    font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:9px;
  }
  html[dir="rtl"] .set-label{ text-transform:none; letter-spacing:0; }
  .set-label svg{ color:var(--accent); }
  .theme-seg{ display:flex; border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; }
  .theme-seg button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:none; border:none; color:var(--muted);
    font:inherit; font-weight:700; font-size:.86rem;
    padding:12px 8px; cursor:pointer;
    transition: background .2s, color .2s;
    touch-action: manipulation;
  }
  .theme-seg button:hover{ color:var(--accent-hi); }
  .theme-seg button.on{
    background: var(--gold-grad);
    color:var(--on-accent);
  }
  .theme-seg button.on:hover{ color:var(--on-accent); }
  .set-langs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .set-langs button{
    background:var(--surface); border:1px solid var(--line-soft); color:var(--panel-text);
    border-radius:12px; padding:11px 8px;
    font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: border-color .2s, background .2s, color .2s, transform .18s;
    touch-action: manipulation;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .set-langs button:hover{ border-color:var(--accent); }
  .set-langs button:active{ transform:scale(.96); }
  .set-langs button.on{
    border-color:var(--accent); color:var(--accent-hi);
    background:rgba(194,146,79,.13); font-weight:700;
  }

  /* ============ v1.5.0 · Аккаунт: кнопка в шапке ============ */
  .btn-login{
    display:inline-flex; align-items:center; gap:7px;
    height:38px; padding:0 15px; border-radius:99px;
    border:1px solid var(--line); background:var(--surface); color:var(--card);
    font: inherit; font-weight:700; font-size:.82rem; cursor:pointer; white-space:nowrap;
    transition:border-color .2s, background .2s, transform .15s, color .2s, filter .2s;
  }
  .btn-login:hover{ border-color:var(--accent); color:var(--accent-hi); background:var(--hover-tint); }
  .btn-login:active{ transform:scale(.95); }
  .btn-login.gold{
    border-color:transparent; background:var(--gold-grad); color:var(--on-accent);
    box-shadow:0 8px 20px -10px rgba(194,146,79,.55);
  }
  .btn-login.gold:hover{ filter:brightness(1.08); color:var(--on-accent); }
  .btn-login.on span{ max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  /* v1.4.0: кнопка Telegram-канала в шапке — синяя, крупная, но в стиле шапки */
  .btn-tg{
    display:inline-flex; align-items:center; gap:7px;
    height:38px; padding:0 14px; border-radius:99px;
    border:1px solid rgba(42,171,238,.5);
    background:linear-gradient(135deg,#2AABEE,#1E96C8); color:#fff;
    font:inherit; font-weight:800; font-size:.82rem; cursor:pointer; white-space:nowrap;
    text-decoration:none; flex-shrink:0;
    box-shadow:0 6px 16px -8px rgba(34,158,217,.55);
    transition:filter .2s, transform .15s, box-shadow .2s;
  }
  .btn-tg svg{ width:15px; height:15px; flex-shrink:0; }
  .btn-tg:hover{ filter:brightness(1.07); box-shadow:0 8px 20px -8px rgba(34,158,217,.6); }
  .btn-tg:active{ transform:scale(.95); }
  /* v1.4.0: та же кнопка канала — компактный вариант внизу экрана приветствия */
  .btn-tg.wv-tg{
    height:34px; padding:0 16px; font-size:.78rem; margin-top:14px;
    box-shadow:0 4px 12px -6px rgba(34,158,217,.45);
  }

  /* ============ v1.5.0 · Экран приветствия «Добро пожаловать в DALIL SURIYA» ============
     Показывается, пока нет аккаунта и не выбран «Войти как гость».
     Фон — динамичные волны (мотив v1.2.7): 4 слоя, плывут с разной скоростью.
     Волны с периодом 300px сдвигаются на 1200px, с периодом 400px — на 1600px,
     чтобы стык анимации был бесшовным. */
  #welcomeOv{
    position:fixed; inset:0; z-index:10500;
    background:var(--bg); color:var(--card);
    display:flex; flex-direction:column; align-items:center;
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:18px 18px 44px;
  }
  .wv-bg{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .wv-orb{ position:absolute; border-radius:50%; filter:blur(90px); }
  .wv-orb1{ width:520px; height:520px; top:-180px; inset-inline-start:-160px;
            background:radial-gradient(circle,#8A6A3B 0%,transparent 70%); opacity:.34; }
  .wv-orb2{ width:560px; height:560px; bottom:-220px; inset-inline-end:-180px;
            background:radial-gradient(circle,#2C4A66 0%,transparent 70%); opacity:.5; }
  .wv-grid{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(126,138,161,.14) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,transparent 85%);
            mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,transparent 85%);
  }
  .wv-wave{ position:absolute; left:0; bottom:-4px; width:2600px; height:150px; will-change:transform; }
  .wv1{ animation:wvA 19s linear infinite; }
  .wv2{ animation:wvA 29s linear infinite reverse; opacity:.9; }
  .wv3{ animation:wvB 37s linear infinite; }
  .wv4{ animation:wvB 23s linear infinite reverse; opacity:.85; }
  @keyframes wvA{ from{ transform:translateX(0); } to{ transform:translateX(-1200px); } }
  @keyframes wvB{ from{ transform:translateX(0); } to{ transform:translateX(-1600px); } }
  .wv-top{ width:100%; max-width:430px; display:flex; justify-content:center; margin-bottom:14px; }
  .wv-langs{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .wv-langs button{
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font: inherit; font-size:.68rem; font-weight:700; letter-spacing:.06em;
    padding:6px 10px; border-radius:8px; cursor:pointer;
    transition:border-color .2s, color .2s, background .2s, transform .15s;
  }
  .wv-langs button:hover{ border-color:var(--accent); color:var(--accent-hi); }
  .wv-langs button:active{ transform:scale(.94); }
  .wv-langs button.on{ border-color:var(--accent); color:var(--accent-hi); background:var(--hover-tint); }
  .wv-card{
    width:100%; max-width:430px; margin:auto 0; position:relative;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    animation:wvIn .5s ease both;
  }
  @keyframes wvIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .wv-mark{
    width:64px; height:64px; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    background:var(--gold-grad); color:var(--on-accent);
    box-shadow:0 18px 40px -18px rgba(194,146,79,.65), inset 0 1px 0 rgba(255,255,255,.35);
    margin-bottom:14px;
  }
  .wv-mark svg{ width:34px; height:34px; }
  .wv-brand{ font-weight:800; letter-spacing:.24em; font-size:.8rem; color:var(--accent-hi); }
  .wv-tag{ font-size:.7rem; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:4px; }
  html[dir="rtl"] .wv-tag{ text-transform:none; letter-spacing:normal; }
  .wv-title{ font-size:1.55rem; font-weight:800; line-height:1.3; margin-top:10px; }
  .wv-title em{ font-style:normal;
    background:linear-gradient(135deg,var(--accent-hi),var(--accent2));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .wv-sub{ color:var(--muted); font-size:.88rem; line-height:1.6; margin-top:10px; max-width:370px; }
  .wv-btns{ width:100%; max-width:370px; margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .wv-soc{
    display:flex; align-items:center; gap:12px; width:100%;
    min-height:50px; padding:10px 16px; border-radius:14px;
    border:1px solid var(--line); background:var(--panel); color:var(--panel-text);
    font: inherit; font-size:.9rem; font-weight:700; cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:border-color .2s, transform .15s, box-shadow .2s, filter .2s;
  }
  .wv-soc:hover{ border-color:var(--accent); transform:translateY(-1px); filter:brightness(1.04); }
  .wv-soc:active{ transform:scale(.98); }
  .wv-soc > span:last-child{ flex:1; text-align:start; }
  .wv-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .wv-row3 .wv-soc{ justify-content:center; padding:10px 8px; font-size:.8rem; min-height:48px; gap:8px; }
  .wv-row3 .wv-soc > span:last-child{ flex:0; text-align:center; }
  /* v1.4.0: Email — главная кнопка входа (на всю ширину), WA/SMS — в 2 колонки */
  .wv-soc.wv-mail{ width:100%; min-height:48px; justify-content:flex-start; padding:10px 14px; font-size:.8rem; gap:8px; }
  .wv-row3.wv-row2{ grid-template-columns:1fr 1fr; }
  .wv-ic{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .wv-ic svg{ width:16px; height:16px; }
  .wv-ic.g{ background:#fff; color:#1a73e8; border:1px solid rgba(0,0,0,.06); }
  .wv-ic.f{ background:#1877F2; color:#fff; }
  .wv-ic.wa{ background:#25D366; color:#fff; }
  .wv-ic.m, .wv-ic.sms{ background:var(--hover-tint); color:var(--accent-hi); border:1px solid var(--line); }
  .wv-div{ display:flex; align-items:center; gap:12px; width:100%; max-width:370px; margin:18px 0 12px; color:var(--muted); }
  .wv-div span{ flex:1; height:1px; background:var(--line-soft); }
  .wv-div em{ font-style:normal; font-size:.75rem; }
  .wv-guest{
    width:100%; max-width:370px; min-height:50px; border-radius:14px;
    border:1.5px dashed var(--accent); background:transparent; color:var(--accent-hi);
    font: inherit; font-size:.92rem; font-weight:800; cursor:pointer;
    transition:background .2s, transform .15s, filter .2s;
  }
  .wv-guest:hover{ background:var(--hover-tint); }
  .wv-guest:active{ transform:scale(.98); }
  .wv-have{ margin-top:16px; color:var(--muted); font-size:.85rem; }
  .wv-have button{ background:none; border:none; color:var(--accent-hi); font: inherit; font-weight:800; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .wv-have button:hover{ filter:brightness(1.15); }
  /* v1.6.0 · заметка о безопасности + честные «скоро»-чипы WhatsApp/SMS */
  .wv-real{ margin-top:18px; max-width:370px; font-size:.68rem; line-height:1.55; color:var(--muted); opacity:.75; }
  .wv-real.au-real{ margin-top:14px; }
  .wv-soc{ position:relative; }
  .wv-soc.soon{ opacity:.55; }
  .wv-soc.soon:hover{ transform:none; border-color:var(--line); filter:none; }
  .wv-soc.soon:active{ transform:scale(.98); }
  .soon-b{
    font-size:.55rem; font-style:normal; font-weight:800; letter-spacing:.3px;
    padding:2px 6px; border-radius:999px; background:var(--gold-grad); color:var(--on-accent);
    pointer-events:none; flex-shrink:0; margin-inline-start:2px; line-height:1.4;
  }
  .au-methods button.soon{ opacity:.55; }
  .au-methods button.soon:hover{ border-color:var(--line); color:var(--muted); }

  /* ============ v1.5.0 · Модалка входа/регистрации ============ */
  /* Выше экрана приветствия (10500): вход открывается и ПОВЕРХ welcome —
     иначе шаг согласия Google/Facebook остаётся за экраном приветствия */
  #authOverlay{ z-index:10600; }
  /* v1.4.0: модалка удаления открывается ПОВЕРХ настроек (иначе настройки, что в DOM позже, её перекрывали) */
  #delAccOverlay{ z-index:10600; }
  .auth-tabs{
    display:flex; background:var(--input-bg); border:1px solid var(--line-soft);
    border-radius:12px; padding:4px; gap:4px; margin-bottom:18px;
  }
  .auth-tabs button{
    flex:1; border:none; background:transparent; color:var(--muted);
    font: inherit; font-weight:700; font-size:.85rem; padding:10px 6px;
    border-radius:9px; cursor:pointer; transition:all .2s;
  }
  .auth-tabs button.on{
    background:var(--gold-grad); color:var(--on-accent);
    box-shadow:0 6px 16px -8px rgba(194,146,79,.6);
  }
  .au-soc2{ display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .wv-div.au-div{ margin:14px 0 14px; max-width:none; }
  .au-methods{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .au-methods button{
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font: inherit; font-size:.78rem; font-weight:700; padding:9px 6px;
    border-radius:10px; cursor:pointer; transition:all .2s;
  }
  .au-methods button.on{ border-color:var(--accent); color:var(--accent-hi); background:var(--hover-tint); }
  .au-code-row{ display:flex; gap:9px; }
  .au-code-row input{ flex:1; min-width:0; }
  .au-code-row .btn{ flex-shrink:0; padding:0 14px; font-size:.8rem; }
  .au-code-note{ margin-top:9px; font-size:.78rem; color:var(--accent-hi); line-height:1.5; }
  .auth-consent{ text-align:center; padding:6px 2px 2px; }
  .ac-ic{
    width:52px; height:52px; margin:0 auto 12px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .ac-ic svg{ width:26px; height:26px; }
  .auth-consent h4{ font-size:1.05rem; font-weight:800; }
  .auth-consent p{ color:var(--muted); font-size:.85rem; line-height:1.55; margin:8px 0 16px; }
  .ac-account{
    display:flex; align-items:center; gap:11px;
    border:1px solid var(--line); border-radius:12px; padding:11px 13px;
    background:var(--surface); text-align:start;
  }
  .ac-av{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--gold-grad); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; font-weight:800;
  }
  .ac-mail{ font-size:.86rem; font-weight:700; word-break:break-all; }
  /* ============ v1.4.0 · Удаление аккаунта (Настройки → «Удалить аккаунт») ============ */
  .acc-del{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border:1px solid rgba(224,122,108,.45); border-radius:12px;
    background:rgba(224,122,108,.07); color:#E07A6C;
    font:inherit; font-weight:700; font-size:.9rem;
    padding:12px 10px; cursor:pointer;
    transition:background .2s, border-color .2s, transform .15s;
    touch-action: manipulation;
  }
  .acc-del:hover{ background:rgba(224,122,108,.15); border-color:rgba(224,122,108,.7); }
  .acc-del:active{ transform:scale(.97); }
  .acc-del svg{ width:16px; height:16px; flex-shrink:0; }
  .acc-del-note{ margin-top:9px; font-size:.74rem; line-height:1.5; color:var(--muted); }
  .gate-ic.del-ic{ background:rgba(224,122,108,.16); color:#E07A6C; box-shadow:0 14px 30px -14px rgba(224,122,108,.45); }
  .del-acc .modal-actions{ margin-top:18px; }
  html[data-theme="light"] .acc-del{ color:#A45340; border-color:rgba(180,84,63,.4); background:rgba(180,84,63,.07); }
  html[data-theme="light"] .gate-ic.del-ic{ color:#A45340; border-color:transparent; background:rgba(180,84,63,.1); }
  html[data-theme="light"] .acc-del:hover{ background:rgba(180,84,63,.14); border-color:rgba(180,84,63,.65); }
  html[data-theme="light"] .btn-danger{ color:#A45340; border-color:rgba(180,84,63,.45); }

  /* ============ v1.5.0 · Гейт «Создайте аккаунт или войдите» ============ */
  .gate-modal{ text-align:center; max-width:380px; }
  .gate-ic{
    width:58px; height:58px; margin:2px auto 12px; border-radius:18px;
    background:var(--gold-grad); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 30px -14px rgba(194,146,79,.6);
  }
  .gate-modal h3{ font-size:1.15rem; font-weight:800; margin-bottom:8px; color:var(--panel-text); }
  .gate-modal .modal-desc{ margin-bottom:18px; }
  .gate-enter{
    display:block; width:100%; margin-top:13px;
    background:none; border:none; color:var(--accent-hi);
    font: inherit; font-size:.9rem; font-weight:800; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px;
  }
  .gate-enter:hover{ filter:brightness(1.15); }

  /* ============ Светлая тема «Warm Sand» ============ */
  html[data-theme="light"]{
    --bg:#F1EBE2;
    --bg2:#E9E2D5;
    --panel:#FCF8F1;
    --panel2:#FFFFFF;
    --panel-text:#22303C;
    --card:#1B3A50;
    --muted:#6C7F8C;
    --accent:#2F7D8E;
    --accent2:#B0895A;
    --accent-hi:#3E93A4;
    --accent-lo:#225967;
    --on-accent:#062630;
    --gold-grad:linear-gradient(135deg,#4FA3B2,#2F7D8E 60%,#1F6272);
    --line:rgba(27,58,80,.3);
    --line-soft:rgba(27,58,80,.15);
    --surface:rgba(27,58,80,.05);
    --hover-tint:rgba(47,125,142,.1);
    --bar-bg:rgba(241,235,226,.9);
    --overlay-bg:rgba(27,58,80,.38);
    --input-bg:rgba(27,58,80,.06);
    --shadow-card:0 14px 34px -22px rgba(8,58,79,.45);
    --shadow-pop:0 24px 60px -24px rgba(8,58,79,.55);
  }
  html[data-theme="light"] .err-banner{ background:rgba(180,84,63,.1); color:#A45340; border-color:rgba(180,84,63,.4); }
  html[data-theme="light"] .orb1{ background:radial-gradient(circle,#E5C285 0%,transparent 70%); opacity:.5; }
  html[data-theme="light"] .orb2{ background:radial-gradient(circle,#9FC4CE 0%,transparent 70%); opacity:.6; }
  html[data-theme="light"] .bg-grid{
    background-image:radial-gradient(rgba(27,58,80,.18) 1px, transparent 1px);
  }
  html[data-theme="light"] .moon{
    background: radial-gradient(circle at 38% 32%, #FDF3CF, #EFCE93 55%, #D9AE68 90%);
    box-shadow:0 0 36px 10px rgba(238,205,140,.7), 0 0 100px 34px rgba(216,180,116,.4);
    filter:none;
  }
  html[data-theme="light"] .tw{ background:#C99A55; box-shadow:0 0 8px 2px rgba(201,154,85,.5); }
  html[data-theme="light"] .hero h1 em{
    background:linear-gradient(135deg,#B3793B,#8F5E2A);
    -webkit-background-clip:text; background-clip:text;
  }
  html[data-theme="light"] .bn-badge{ border-color:var(--bg); }
  html[data-theme="light"] .btn-gear .mini-badge{ border-color:var(--bg); }
  html[data-theme="light"] .dalil-pin{ border-color:rgba(255,255,255,.75); }
  html[data-theme="light"] .toast{ border-inline-start-color:var(--accent); }
  /* v1.5.0: экран приветствия на светлой теме */
  html[data-theme="light"] .wv-orb1{ background:radial-gradient(circle,#E5C285 0%,transparent 70%); opacity:.5; }
  html[data-theme="light"] .wv-orb2{ background:radial-gradient(circle,#9FC4CE 0%,transparent 70%); opacity:.6; }
  html[data-theme="light"] .wv-grid{ background-image:radial-gradient(rgba(27,58,80,.16) 1px, transparent 1px); }

  /* ============ Мобильная версия ============ */
  @media (max-width: 760px){
    body{ font-size:15px; padding-bottom:96px; }
    .topbar{ height:56px; padding:0 10px; gap:7px; }
    .brand{ font-size:.78rem; letter-spacing:.04em; gap:6px; overflow:hidden; }
    .btn-tg{ height:34px; padding:0 11px; font-size:.75rem; }
    .brand svg{ width:20px; height:20px; }
    .brand-sub{ display:none; }
    .topbar .btn-sub{ display:none; }
    /* v1.5.0: кнопка аккаунта — заметная и на телефоне */
    .btn-login{ height:34px; padding:0 12px; font-size:.78rem; }
    .btn-login.on span{ max-width:90px; }
    .btn-admin{ padding:7px 9px; margin-inline-start:0; }
    .btn-admin .t{ display:none; }
    .btn-gear{ width:36px; height:36px; }

    .hero{ padding:32px 14px 14px; }
    .hero h1{ font-size: clamp(1.5rem, 7.4vw, 2.05rem); gap:7px; }
    .hero-star{ width:.85em; height:.85em; }
    .hero-alt{ font-size:.9rem; }
    .hero-desc{ font-size:.9rem; margin-top:12px; }
    .search{ padding:10px 12px; font-size:.9rem; }
    .moon-wrap{ width:44px; height:44px; top:56px; }

    .cats{ padding:0 14px; gap:7px; }
    .cat-pill{ padding:7px 12px; font-size:.8rem; }
    .cat-pill .cnt{ font-size:.64rem; }

    .subs{ padding:0 14px; }
    .cities{ padding:0 14px; margin-top:22px; }

     Делегирование на document: работает и для карточек, созданных динамически.
