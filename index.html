     у мелких кнопок (шестерёнка, крестик, темы, языки) остаётся быстрый :active-отклик. */
  const RIP_SEL = ".btn, .btn-sub, .btn-add, .btn-admin, .cat-pill, .chip, " +
    ".city-card, .level-card, .plan, .float-sub, .float-panel, .adm-tab, .tool-btn, .modal-back, .bn-item, .bn-fab";
  const RIP_SOLID = ".btn-solid, .btn-sub, .btn-add, .float-sub, .float-panel, .bn-fab, " +
    ".cat-pill.on";
  document.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return; // левая кнопка / тач / перо — правый клик молчит
    const host = e.target.closest(RIP_SEL);
    if (!host || !host.isConnected) return;
    host.classList.add("rip-host");
    const r = host.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 1.7 + 6;
    const sp = document.createElement("span");
    sp.className = "rip" + (host.matches(RIP_SOLID) ? " on-solid" : "");
    sp.style.width = sp.style.height = d + "px";
    sp.style.left = (e.clientX - r.left - d / 2) + "px";
    sp.style.top  = (e.clientY - r.top  - d / 2) + "px";
    host.appendChild(sp);
    /* FIX v1.2.4: span.rip удаляется вместе с классом .rip-host — раньше класс
       оставался навсегда и держал на кнопке position:relative (см. CSS-хотфикс).
       Если на хосте ещё живёт другой span (быстрый повторный тап) — класс ждёт его */
    const dropRip = () => {
      sp.remove();
      if (!host.querySelector(".rip")) host.classList.remove("rip-host");
    };
    sp.addEventListener("animationend", dropRip, { once: true });
    setTimeout(dropRip, 700); // страховка, если анимация прервана
  }, { passive: true });

  const icon = (n, s = 16) =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

  /* ================= Состояние ================= */
  const state = {
    lang: (() => {
      const l = store.get("dalil_lang") || store.get("rakka_lang");
      if (["ru","ar","en","ku","de","tr"].includes(l)) return l;
      /* v1.3.3: первый запуск — берём ЯЗЫК УСТРОЙСТВА, а не жёсткий арабский.
         Телефон на русском → приложение на русском; на арабском → на арабском. */
      const nav = (navigator.languages && navigator.languages.length)
        ? navigator.languages : [navigator.language || "ar"];
      for (const tag of nav) {
        const p = String(tag).slice(0, 2).toLowerCase();
        if (["ru","ar","en","ku","de","tr"].includes(p)) return p;
      }
      return "ar";   /* фолбэк для прочих языков (справочник Сирии) */
    })(),

    search: "",
    sort: (() => { const s = store.get("dalil_sort"); return ["new","name","views","rate","near"].includes(s) ? s : "new"; })(),

  /* ================= v1.3.0 · Избранное (localStorage) =================
     Сердце на каждой карточке; контакты сохраняются в браузере посетителя —
     без аккаунта и без записи в базу. Чип «Избранное» в списке показывает
     только отмеченные анкеты. */
  const FAV_KEY = "dalil_fav";
  const favSet = (() => {
    try { return new Set(JSON.parse(store.get(FAV_KEY) || "[]")); }
    catch { return new Set(); }
  })();
  const isFav = (id) => favSet.has(id);
  /* v1.2.7: дебаунс 400 мс — случайный двойной тап не снимает только что
     добавленное избранное обратно */
  let lastFavId = null, lastFavT = 0;
  function toggleFav(id) {
    /* v1.5.0: добавление в избранное — только для аккаунтов.
       Убрать из избранного можно и без входа; гостям открывается гейт. */
    if (!favSet.has(id) && !isAuthed()) { askAuth("fav"); return false; }
    const now = Date.now();
    if (id === lastFavId && now - lastFavT < 400) return isFav(id);
    lastFavId = id; lastFavT = now;
    const on = !favSet.has(id);
    if (on) favSet.add(id); else favSet.delete(id);
    store.set(FAV_KEY, JSON.stringify([...favSet]));
    toast(t(on ? "favAdded" : "favRemoved"));
    return on;
  }
  let pendingDeleteId = null;
  let editingId = null;   /* id карточки в режиме редактирования (null = обычное добавление) */
  let formRoutes = [];    /* маршруты (перевозки) в текущей сессии формы */
  let animCats = false;   /* однократная анимация категорий после выбора города */
  let animCities = true;  /* анимация сетки городов при загрузке и смене языка */

  const inCity = (d) => !state.city || docCityId(d) === state.city;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const t = (key, lang = state.lang) => I18N[lang][key] || I18N.ar[key] || I18N.ru[key] || key;
  const nm = (o) => o[state.lang] || o.ku || o.ar || o.ru;
  const catById = (id) => CATS.find(c => c.id === id);

  function subName(groupId, subId) {
    for (const c of CATS) {
      for (const l of levelsOf(c)) {
        if (l.id === groupId) {
          const s = l.subs.find(x => x.id === subId);
          if (s) return nm(s);
          return subId;
        }
      }
    }
    return subId;
  }
  const catName = (c) => nm(c);
  const levelName = (l) => nm(l);

  /* Имя карточки на текущем языке: names.{ar,en} — вводятся админом вручную в форме, иначе исходное название */
  const pname = (p) => {
    const n = p && p.names;
    if (n) { const v = n[state.lang]; if (v) return v; }
    return (p && p.title) || "";
  };
  /* Поиск по автопереводам названия — карточка находится запросом на любом из 4 языков */
  const namesHit = (d, q) => {
    const n = d.names;
    if (!n) return false;
    for (const k in n) if (String(n[k] || "").toLowerCase().includes(q)) return true;
    return false;
  };

  /* ================= v1.2.7 · Триграммный нечёткий поиск =================
     Запрос и текст анкеты режутся на 3-символьные куски (триграммы);
     совпадение ≥ 30% триграмм запроса находит анкету с опечаткой или
     неполным словом: «хлебб» → «хлеб», «الشعيي» → «الشعيب», «пекрня» → «пекарня».
     Арабские диакритики снимаются, регистр не важен. */
  const stripDiac = (s) => String(s || "").replace(/[\u064B-\u065F\u0670]/g, "");
  const trigramsOf = (s) => {
    const str = stripDiac(s).toLowerCase().replace(/\s+/g, " ").trim();
    const set = new Set();
    for (let i = 0; i + 3 <= str.length; i++) set.add(str.slice(i, i + 3));
    return set;
  };
  const triSim = (a, b) => {
    if (!a.size || !b.size) return 0;
    let inter = 0;
    for (const g of a) if (b.has(g)) inter++;
    return inter / a.size;
  };
  /* Весь текстовый «след» анкеты одним куском: названия, описание, марка,
     подкатегория и город — поиск находит и по типу бизнеса («хлеб», «مخبز») */
  const docBlob = (d) => [
    d.title, d.titleEn, d.description, d.carMake,
    d.names && d.names.ar, d.names && d.names.en,
    subName(d.group, d.subcategory), cityName(docCityId(d))
  ].join(" ");

  function withTimeout(promise, ms = 15000) {
    return Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(() => rej({ code: "app/timeout" }), ms))
    ]);
  }

  /* ================= Тосты и плашки ================= */
  const toastWrap = $("toastWrap");
  function toast(msg, type = "ok", ms = 3000) {
    const d = document.createElement("div");
    d.className = "toast" + (type === "err" ? " err" : "");
    d.textContent = msg;
    toastWrap.appendChild(d);
    setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 350); }, ms);
  }
  function banner(el, key) { bannerMsg(el, t(key)); }
  /* Понятный текст ошибки записи (сервер dalil-api) */
  const writeErrText = (err) =>
    "⚠ " + ((err && (err.code || err.message)) || t("loadError"));
  function bannerMsg(el, text) {
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(el._tm);
    el._tm = setTimeout(() => el.classList.remove("show"), 3000);
  }

  /* ================= Автоудаление (TTL) ================= */
  const isExpired = (p) => p.expiresAt && Number(p.expiresAt) <= Date.now();

  async function sweepExpired() {
    const expired = state.docs.filter(isExpired);
    if (!expired.length) return;
    if (state.admin) {
      for (const p of expired) {
        try { await dbRemove(p.id); }
        catch (e) { console.error("TTL delete:", e && e.message); }
      }
    } else {
      renderList();
    }
  }
  setInterval(sweepExpired, 3000);

  /* ================= Данные (наш сервер dalil-api) ================= */

  function setConn(mode) {
    const el = $("connState");
    el.className = "conn " + mode;
    $("connText").textContent = t(mode === "online" ? "connOnline" : "connCache");
  }

  function applySnapshot(docs, cached) {
    state.docs = (docs || []).map(d => ({ ...d }));
    state.docs.sort((a, b) => {
      const sa = (a.createdAt && a.createdAt.seconds) || 0;
      const sb = (b.createdAt && b.createdAt.seconds) || 0;
      return sb - sa;
    });
    renderAll();
    updateReminders();   /* v1.2.7: пересчёт истекающих анкет на каждой загрузке */
    updateNotifications();   /* v1.3.0: три сценария уведомлений */
    /* v1.3.0: если админ-панель открыта — статистика и вкладки обновляются сразу */
    if (state.admin && $("admOverlay").classList.contains("show")) renderAdmPane();
    setConn(cached ? "cache" : "online");
  }

  async function loadOnce() {
    try {
      const r = await withTimeout(fetch(API + "/api/catalog"), 15000);
      const j = await r.json();
      if (j.ok && Array.isArray(j.docs)) { applySnapshot(j.docs, false); return true; }
    } catch (e) { console.warn("[DALIL v" + APP_VERSION + "] catalog:", e && e.message); }
    setConn("cache");
    return false;
  }

  function startListener() { loadOnce(); }

  /* ================= v1.3.3 · АВТООБНОВЛЕНИЕ КАЖДУЮ МИНУТУ У ВСЕХ =================
     живой канал бывает нестабилен в мобильных сетях: соединение умирает тихо
     и обновления доезжают только после клика/перезагрузки страницы. Сторож каждую минуту
     (при открытой вкладке/экране) сверяется
     с сервером напрямую: данных нет изменений — экран не трогаем (без скачков
     скролла), изменились — applySnapshot перерисует. Плюс мгновенная сверка
     при возврате в приложение. Заявку обновившему ничего делать не нужно. */
  function docsSignature(docs) {
    return docs.map(d => [
      d.id,
      (d.updatedAt && d.updatedAt.seconds) || 0,
      (d.createdAt && d.createdAt.seconds) || 0,
      d.views || 0, d.rateSum || 0, d.rateCount || 0,
      d.expiresAt || 0, d.title || "", d.phone || "", d.lat || "", d.lng || ""
    ].join("~")).join("|");
  }
  let lastResyncT = 0;
  async function resyncOnce() {
    const now = Date.now();
    if (now - lastResyncT < 45000) return;   /* анти-дребезг: интервал + возврат на вкладку */
    lastResyncT = now;
    try {
      const r = await withTimeout(fetch(API + "/api/catalog"), 15000);
      const j = await r.json();
      if (!(j.ok && Array.isArray(j.docs))) return;
      const fresh = j.docs.map(d => ({ ...d }));
      if (docsSignature(fresh) === docsSignature(state.docs)) { setConn("online"); return; }
      applySnapshot(fresh, false);
    } catch (e) { console.warn("[DALIL v" + APP_VERSION + "] resync:", (e && e.message) || e); }
  }
  setInterval(() => { if (!document.hidden) resyncOnce(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) resyncOnce(); });

  /* ---- Админские операции -> наш сервер (Bearer-токен админа) ---- */
  async function admFetch(path, opts = {}) {
    const r = await withTimeout(fetch(API + path, {
      ...opts,
      headers: Object.assign({ "Content-Type": "application/json" },
        adminToken ? { Authorization: "Bearer " + adminToken } : {}),
    }), 20000);
    if (r.status === 401) {
      adminLogout(true);
      throw Object.assign(new Error("unauthorized"), { code: "unauthorized" });
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false)
      throw Object.assign(new Error(j.error || ("HTTP " + r.status)), { code: j.error || ("http_" + r.status) });
    return j;
  }
  function adminLogout(silent) {
    adminToken = "";

      if (!silent) toast(t("toastLoggedOut"));

  async function dbAdd(data) {

  async function dbUpdate(id, data) {
    const j = await admFetch("/api/admin/providers/" + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(data) });
    await loadOnce(); return j;
  }
  async function dbRemove(id) {
    const j = await admFetch("/api/admin/providers/" + encodeURIComponent(id), { method: "DELETE" });
    await loadOnce(); return j;
  }

  /* ================= Рендер ================= */
  function renderCities() {
    const el = $("cityGrid");

    animCities = false;
    el.innerHTML = CITIES.map((c, i) => {
      const cnt = state.docs.filter(d => !isExpired(d) && docCityId(d) === c.id).length;

      return `<button type="button" class="city-card${state.city === c.id ? " on" : ""}" data-city="${c.id}"${delay}>

  function renderSubs() {
    const el = $("subs");
    const cat = catById(state.cat);
    const lvls = levelsOf(cat);
    const cur = lvls.find(l => l.id === state.level) || lvls[0];

    if (cat.cardMode) {

      el.innerHTML = `<div class="level-cards">

            card(s.id, nm(s),
                 state.docs.filter(d => d.group === cat.id && d.subcategory === s.id && inCity(d) && !isExpired(d)).length,
                 i, state.sub === s.id)).join("")}

    }

    if (cat.levels) {
      const levelCard = (l, i, chosenCls) => `
        <button type="button" class="level-card${chosenCls}" data-level="${l.id}" style="animation-delay:${i*90}ms">
          <span class="lc-top">

          </span>
          <span class="lc-sub">${esc(t("chooseLevel"))}</span>
          <span class="lc-cnt">${state.docs.filter(d => d.group === l.id && inCity(d) && !isExpired(d)).length}</span>
        </button>`;

      if (!state.levelSelected) {
        el.innerHTML = `<div class="level-cards">${lvls.map((l,i) => levelCard(l,i,"")).join("")}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="level-cards">
          ${lvls.map((l,i) => levelCard(l,i, l.id === state.level ? " on" : "")).join("")}
        </div>
        <div class="subjects-block">
          <div class="subjects-title">${icon("book", 14)}<span>${esc(t("subjectsWord"))}</span></div>
          <button type="button" class="chip${state.sub === "all" ? " on" : ""}" data-sub="all">${esc(t("all"))}</button>
          ${cur.subs.map(s =>
            `<button type="button" class="chip${state.sub === s.id ? " on" : ""}" data-sub="${s.id}">${esc(nm(s))}</button>`).join("")}
          <button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
            ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>
        </div>`;
      return;
    }

    let html = `<button type="button" class="chip${state.sub === "all" ? " on" : ""}" data-sub="all">${esc(t("all"))}</button>`;
    html += cur.subs.map(s =>
      `<button type="button" class="chip${state.sub === s.id ? " on" : ""}" data-sub="${s.id}">${esc(nm(s))}</button>`
    ).join("");
    html += `<button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
      ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>`;
    el.innerHTML = html;
  }

  function filtered() {
    let items = state.docs.filter(d => d.group === state.level && inCity(d) && !isExpired(d));
    if (state.sub !== "all") items = items.filter(d => d.subcategory === state.sub);
    if (state.dest && state.dest !== "all") items = items.filter(d => Array.isArray(d.routes) && d.routes.includes(state.dest));
    /* v1.3.0: чип «Избранное» — только отмеченные сердечком анкеты */
    if (state.favOnly) items = items.filter(d => favSet.has(d.id));
    if (state.search) {
      const q = state.search.toLowerCase();
      const qs = q.replace(/\s/g, "");
      const hits = citiesInQuery(state.search);
      const textMatch = (d) =>
        (d.title || "").toLowerCase().includes(q) ||
        (d.description || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.carMake || "").toLowerCase().includes(q) ||
        namesHit(d, q);
      /* v1.2.7: нечёткий резерв — если точное вхождение не нашлось,
         триграммы прощают опечатки и неполные слова (запрос от 3 символов) */
      const qTrim = q.replace(/\s+/g, " ").trim();
      const qTri = qTrim.length >= 3 ? trigramsOf(qTrim) : null;
      const fuzzyMatch = (d) => !!qTri && triSim(qTri, trigramsOf(docBlob(d))) >= 0.3; /* ВАЖНО: qTri ПЕРВЫМ — делим на триграммы ЗАПРОСА, а не документа */
      const pairMode = hits.length >= 2; /* «Ракка - Алеппо»: явное направление */
      items = items.filter(d => {
        /* Перевозки — СТРОГО по направлению: пункт А = город анкеты,
           пункт Б = добавленные направления. Поиск «Ракка - Алеппо»
           показывает только анкеты с городом Ракка и пунктом Б Алеппо */
        if (d.subcategory === "transport" && hits.length) {
          const routes = Array.isArray(d.routes) ? d.routes : [];
          const from = docCityId(d);
          if (hits.length === 1) {
            const g = hits[0];
            return g === from || routes.includes(g);
          }
          /* 2+ города: направление по порядку упоминания:
             «Ракка - Алеппо» = из Ракки в Алеппо:
             пункт А анкеты = первый город, пункт Б = второй */
          for (let i = 0; i < hits.length; i++)
            for (let j = i + 1; j < hits.length; j++)
              if (hits[i] === from && routes.includes(hits[j])) return true;
          return false;
        }
        /* При явном направлении «откуда - куда» посторонние анкеты не показываются */
        return !pairMode && (textMatch(d) || fuzzyMatch(d));
      });
    }
    /* Сортировка анкет перевозок по пункту А (городу анкеты):
       анкеты группируются по городам отправления */
    if (state.sub === "transport" && state.sort === "new")
      items.sort((a, b) =>
        CITIES.findIndex(c => c.id === docCityId(a)) - CITIES.findIndex(c => c.id === docCityId(b)));
    /* v1.3.0: сортировка посетителя — «По имени» / «Популярные»
       (выбор сохраняется в dalil_sort; для перевозок перекрывает группировку) */
    if (state.sort === "name")
      items.sort((a, b) => pname(a).localeCompare(pname(b), state.lang || "ar"));
    if (state.sort === "views")
      items.sort((a, b) => (Number(b.views) || 0) - (Number(a.views) || 0));
    /* v1.3.0: «По рейтингу» — сверху оценённые, без голосов — в конце;
       «Ближе» — нужна геолокация («Рядом со мной»), без координат — в конце */
    if (state.sort === "rate")
      items.sort((a, b) => rateAvgNum(b) - rateAvgNum(a));
    if (state.sort === "near" && myPos)
      items.sort((a, b) => distTo(a) - distTo(b));
    return items;
  }

  /* ================= Счётчик просмотров анкеты ================= */
  /* +1 при каждом открытии карточки, а также при кликах «Позвонить»,
     «WhatsApp» (написать) и «Копировать» (номер). Число на экране растёт сразу
     (оптимистично), запись на сервер идёт в фоне; сбой (оффлайн)
     тихо игнорируется — посетителю ошибок не показываем */
  function fmtViews(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (Math.round(n / 100) / 10).toString().replace(/\.0$/, "") + "K";
    return String(n);
  }

  function paintViews(id, v) {
    const badges = document.querySelectorAll(`[data-views-badge="${id}"]`);
    if (badges.length) badges.forEach(el => el.textContent = fmtViews(v));
    else renderList();
  }

  function countView(id) {
    const it = state.docs.find(d => d.id === id);
    if (it) {
      it.views = (it.views || 0) + 1;
      paintViews(it.id, it.views);
    }
    /* +1 просмотр на нашем сервере (дедуп 1/день/устройство), ответ = точное число */
    fetch(API + "/api/view", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, deviceId })
    }).then(r => r.json()).then(j => {
      if (j.ok && typeof j.views === "number" && it) { it.views = j.views; paintViews(it.id, j.views); }
    }).catch(() => {});
  }

  /* ================= v1.3.0 · РЕЙТИНГ · КАРТА · УВЕДОМЛЕНИЯ · НАВИГАЦИЯ ================= */

  /* ---------- Рейтинг анкет ----------
     Голос хранится на устройстве (dalil_votes: {id: звёзды}), суммы — на нашем
     сервере (rateSum/rateCount, дедуп и замена голоса по deviceId).
     Свою оценку можно поменять — сервер сам скорректирует сумму. Сбой сети = автодосыл из очереди. */
  const VOTES_KEY = "dalil_votes";
  const votesMap = (() => { try { return JSON.parse(store.get(VOTES_KEY) || "{}") || {}; } catch { return {}; } })();
  let lastVoteT = 0;

  /* ===== v1.4.0 · ОЦЕНКА: наш сервер (дедуп по устройству, замена голоса) =====
     Голос = POST /api/vote {id, deviceId, stars}: сервер помнит голос устройства,
     корректирует сумму при замене и возвращает точные rateSum/rateCount.
     Сбой сети → очередь dalil_voteq (до 200, досыл по online/visibilitychange/
     таймеру 25с). Голос не теряется: уйдёт при первой связи. */
  async function pushVote(id, stars) {
    const r = await withTimeout(fetch(API + "/api/vote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, deviceId, stars, prev: Number(votesMap[id]) || 0 })
    }), 10000);
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw Object.assign(new Error(j.error || "vote_failed"),
      { code: j.error === "not-found" ? "not-found" : "rejected" });
    return j;
  }
  const VOTEQ_KEY = "dalil_voteq";
  const voteQ = (() => {
    try {
      const q = JSON.parse(store.get(VOTEQ_KEY) || "[]");
      return Array.isArray(q) ? q.filter(x => x && typeof x.stars === "number") : [];
    } catch { return []; }
  })();
  const saveVoteQ = () => { try { store.set(VOTEQ_KEY, JSON.stringify(voteQ.slice(-200))); } catch {} };
  let voteQBusy = false;
  function enqueueVote(id, stars) {
    const last = voteQ[voteQ.length - 1];
    if (last && last.id === id) last.stars = stars;   /* одно устройство = один голос */
    else voteQ.push({ id, stars });
    if (voteQ.length > 200) voteQ.splice(0, voteQ.length - 200);
    saveVoteQ();
  }
  async function flushVoteQ() {
    if (voteQBusy || !voteQ.length) return;
    voteQBusy = true;
    try {
      while (voteQ.length) {
        const v = voteQ[0];
        let j = null;
        try { j = await pushVote(v.id, v.stars); }
        catch (err) {
          if (err && err.code === "not-found") { voteQ.shift(); saveVoteQ(); continue; }
          break;                            /* сеть — оставляем на следующий заход */
        }
        voteQ.shift(); saveVoteQ();         /* доставлено — сервер вернул точные суммы */
        const it = state.docs.find(d => d.id === v.id);
        if (it && j) { it.rateSum = j.rateSum; it.rateCount = j.rateCount; paintRate(it); }
      }
    } finally { voteQBusy = false; }
  }
  window.addEventListener("online", flushVoteQ);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) flushVoteQ(); });
  setInterval(flushVoteQ, 25000);
  flushVoteQ();   /* протолкнуть хвост очереди при запуске */

  const rateCountOf = (p) => (Number(p.rateCount) || 0);
  const rateAvgNum = (p) => { const c = rateCountOf(p); return c ? ((Number(p.rateSum) || 0) / c) : -1; };
  const rateAvgStr = (p) => { const v = rateAvgNum(p); return v < 0 ? "—" : (Math.round(v * 10) / 10).toFixed(1); };

  function rateBoxHTML(p) {
    const my = Number(votesMap[p.id]) || 0;
    const stars = [1, 2, 3, 4, 5].map(n =>
      `<button type="button" class="rate-star${my && n <= my ? " on" : ""}" data-star="${n}" aria-label="${n}">${icon("star", 21)}</button>`).join("");
    return `
      <div class="rate-box" data-rate-box="${esc(p.id)}">
        <div class="rate-head">
          <span class="rate-title">${icon("star", 14)}${esc(t("rateTitle"))}</span>
          <span class="rate-sum ltr-num">${rateCountOf(p) ? `${rateAvgStr(p)} · ${rateCountOf(p)}` : "—"}</span>
        </div>
        <div class="rate-stars" dir="ltr">${stars}</div>
      </div>`;
  }

  function paintRate(p) {
    const key = (window.CSS && CSS.escape) ? CSS.escape(p.id) : p.id.replace(/["\\]/g, "\\$&");
    document.querySelectorAll(`[data-rate-badge="${key}"]`).forEach(el => {
      el.innerHTML = `${icon("star", 15)}<span class="ltr-num">${rateAvgStr(p)} (${rateCountOf(p)})</span>`;
    });
    const box = document.querySelector(`[data-rate-box="${key}"]`);
    if (box) {
      const sum = box.querySelector(".rate-sum");
      if (sum) sum.textContent = rateCountOf(p) ? `${rateAvgStr(p)} · ${rateCountOf(p)}` : "—";
      const my = Number(votesMap[p.id]) || 0;
      box.querySelectorAll(".rate-star").forEach(b =>
        b.classList.toggle("on", my && Number(b.dataset.star) <= my));
    }
  }

  function sendVote(p, stars) {
    /* v1.5.0: отзыв/оценка — только для аккаунтов (гостям — гейт) */
    if (!isAuthed()) { askAuth("vote"); return; }
    if (!stars || stars < 1 || stars > 5) return;
    const now = Date.now();
    if (now - lastVoteT < 350) return;   /* дебаунс двойного тапа */
    lastVoteT = now;
    const old = Number(votesMap[p.id]) || 0;
    if (old === stars) return;
    votesMap[p.id] = stars;
    store.set(VOTES_KEY, JSON.stringify(votesMap));
    /* Оптимистично: сумма/счётчик на экране растут сразу */
    p.rateSum = Math.max(0, (Number(p.rateSum) || 0) + stars - old);
    p.rateCount = (Number(p.rateCount) || 0) + (old ? 0 : 1);
    paintRate(p);
    toast(t("rateThanks"));
    /* v1.4.0: голос идёт на наш сервер; сбой сети — очередь с автодолётом */
    let voteTold = false, voteDone = false;
    const tellQueued = () => { if (!voteTold) { voteTold = true; toast(t("rateQueued"), "ok", 4200); } };
    pushVote(p.id, stars).then((j) => {
      voteDone = true;
      p.rateSum = j.rateSum; p.rateCount = j.rateCount;
      paintRate(p);
      flushVoteQ();          /* дошло — заодно протолкнуть хвост очереди */
    }, (err) => {
      voteDone = true;
      if (err && err.code === "not-found") return;  /* анкета удалена — голос не копим */
      console.warn("[DALIL v" + APP_VERSION + "] оценка в очереди:", (err && err.code) || err);
      enqueueVote(p.id, stars);
      flushVoteQ();
      tellQueued();
    });
    /* Если ответа долго нет (мобильная сеть) — не молчим: голос сохранён
       локально и уйдёт при первой связи */
    setTimeout(() => { if (!voteTold && !voteDone) tellQueued(); }, 9000);
  }

  /* ---------- Карта: Leaflet + OpenStreetMap (ленивая загрузка CDN) ---------- */
  const CITY_COORDS = {
    damascus:   [33.5138, 36.2765],
    rifdimashq: [33.4200, 36.3500],
    aleppo:     [36.2021, 37.1343],
    homs:       [34.7324, 36.7137],
    hama:       [35.1318, 36.7578],

    daraa:      [32.6189, 36.1029],
    suwayda:    [32.7090, 36.5715],

    hasakah:    [36.5021, 40.7477],

  /* v1.3.0 · Пины по категориям: свой цвет + иконка категории внутри пина */
  const CAT_PINS = {
    doctors:    { ic: "health", g: "linear-gradient(135deg,#2BB3A3,#147F73)" },
    teachers:   { ic: "cap",    g: "linear-gradient(135deg,#5B9BE8,#2F6BB8)" },
    architects: { ic: "ruler",  g: "linear-gradient(135deg,#A77FE8,#7452B5)" },
    stores:     { ic: "bag",    g: "linear-gradient(135deg,#E7BC4C,#C08E24)" },
    pharmacies: { ic: "pill",   g: "linear-gradient(135deg,#6FC55C,#459635)" },
    services:   { ic: "bell",   g: "linear-gradient(135deg,#E8798F,#BC4A63)" },
    repair:     { ic: "tool",   g: "linear-gradient(135deg,#E8704C,#BC4425)" }
  };

  let myPos = null;               /* «Рядом со мной»: {lat,lng} после геолокации */
  let mapObj = null, markerLayer = null, leafletLoading = null;

  const hasCoords = (p) =>
    p.lat != null && p.lng != null &&
    Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng));

  const fmtCoord = (v) => String(Math.round(Number(v) * 100000) / 100000);

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371, toR = (x) => x * Math.PI / 180;
    const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  const distTo = (p) => hasCoords(p) ? haversineKm(myPos.lat, myPos.lng, Number(p.lat), Number(p.lng)) : 1e9;
  const distKmStr = (p) => {
    const km = distTo(p);
    const s = km >= 100 ? String(Math.round(km)) : (Math.round(km * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return t("distKm").replace("{n}", s);
  };

  /* v1.3.0 · Leaflet: в APK сначала локальная копия из assets (работает офлайн,
     карта открывается даже без интернета), на сайте — три CDN по очереди:
     если один отдаёт 403 или недоступен (unpkg в части регионов), карта
     не ломается — берём следующий. */
  const LEAFLET_CDNS = [
    ...(IS_APK ? [{ css: "leaflet.css", js: "leaflet.js" }] : []),
    { css: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
      js:  "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" },
    { css: "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css",
      js:  "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" },
    { css: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css",
      js:  "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" }
  ];
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletLoading) return leafletLoading;
    leafletLoading = new Promise((res, rej) => {
      const tryCdn = (i) => {
        if (i >= LEAFLET_CDNS.length) { leafletLoading = null; rej(new Error("leaflet-cdn")); return; }
        try {
          const c = LEAFLET_CDNS[i];
          let cssOk = true;
          if (!document.querySelector('link[href="' + c.css + '"]')) {
            const css = document.createElement("link");
            css.rel = "stylesheet";
            css.href = c.css;
            css.onerror = () => { cssOk = false; };
            document.head.appendChild(css);
          }
          const s = document.createElement("script");
          s.src = c.js;
          s.onload = () => { if (cssOk) res(); else tryCdn(i + 1); };
          s.onerror = () => { s.remove(); tryCdn(i + 1); };
          document.head.appendChild(s);
        } catch (e) { tryCdn(i + 1); }
      };
      tryCdn(0);
    });
    return leafletLoading;
  }

  /* ---------- v1.3.0 · Подложки карты с автопереключением ----------
     Основная подложка — Google Maps: полное покрытие Сирии на больших зумах
     (у Esri на зуме по Сирии — тайлы «not available», у OSM — 403 «Access blocked»
     по политике использования). Резервы: Esri → OSM → openstreetmap.de.
     При 5 ошибках тайлов подряд все живые карты переходят на следующий резерв. */
  const TILE_PROVIDERS = [
    { url: "https://{s}.google.com/vt/lyrs=m&hl=ar&x={x}&y={y}&z={z}",
      opt: { maxZoom: 20, subdomains: ["mt0", "mt1", "mt2", "mt3"], attribution: "&copy; Google" } },
    { url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      opt: { maxZoom: 19, attribution: "Tiles &copy; Esri" } },
    { url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      opt: { maxZoom: 19, attribution: "&copy; OpenStreetMap" } },
    { url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
      opt: { maxZoom: 18, attribution: "&copy; OpenStreetMap" } }
  ];
  let tileIdx = 0, tileFails = 0, tileAltToasted = false, tileDeadToasted = false;
  const liveTileLayers = [];
  function makeTileLayer() {
    const p = TILE_PROVIDERS[tileIdx];
    const layer = L.tileLayer(p.url, p.opt);
    layer.on("tileerror", () => {
      tileFails++;
      if (tileFails >= 5 && tileIdx < TILE_PROVIDERS.length - 1) {
        tileIdx++; tileFails = 0;
        rebuildTileLayers();
        if (!tileAltToasted) { tileAltToasted = true; toast(t("mapNetAlt"), "ok", 4500); }
      } else if (tileFails === 15 && !tileDeadToasted) {
        /* все подложки недоступны (нет сети / всё заблокировано провайдером) */
        tileDeadToasted = true; toast(t("mapLoadErr"), "err", 6000);
      }
    });
    return layer;
  }
  function attachTiles(map) {
    const layer = makeTileLayer();
    layer.addTo(map);
    liveTileLayers.push({ map, layer });
    return layer;
  }
  function rebuildTileLayers() {
    for (let i = liveTileLayers.length - 1; i >= 0; i--) {
      const rec = liveTileLayers[i];
      try { rec.map.removeLayer(rec.layer); } catch {}
      try { rec.layer = makeTileLayer(); rec.layer.addTo(rec.map); }
      catch { liveTileLayers.splice(i, 1); }
    }
  }

  async function ensureMap() {
    try { await loadLeaflet(); }
    catch { toast(t("mapLoadErr"), "err", 6000); return null; }
    if (mapObj) return mapObj;
    const el = $("mapCanvas");
    if (!el || !window.L) return null;
    mapObj = L.map(el, { zoomControl: true });
    attachTiles(mapObj);
    markerLayer = L.layerGroup().addTo(mapObj);
    /* Кнопка «Открыть» в попапе → детальная карточка */
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-open-doc]");
      if (b) openDetail(b.dataset.openDoc);
    });
    return mapObj;
  }

  function renderMap() {
    if (!mapObj || !markerLayer) return;
    markerLayer.clearLayers();
    if (myPos) {
      markerLayer.addLayer(L.circleMarker([myPos.lat, myPos.lng],
        { radius: 7, color: "#3E93A4", weight: 2, fillColor: "#6FC3D2", fillOpacity: .95 }));
    }
    const docs = state.docs.filter(d => !isExpired(d) && inCity(d) && hasCoords(d));
    docs.forEach(d => {
      const pin = CAT_PINS[d.category];
      const pinHtml = `<div class="dalil-pin"${pin ? ` style="--pin-g:${pin.g}"` : ""}>${pin ? icon(pin.ic, 13) : icon("pin", 13)}</div>`;
      const m = L.marker([Number(d.lat), Number(d.lng)], {
        icon: L.divIcon({
          className: "",
          html: pinHtml,
          iconSize: [30, 30], iconAnchor: [15, 28], popupAnchor: [0, -26]
        })
      });
      m.bindPopup(
        `<div class="map-pop"><b>${esc(pname(d))}</b>` +
        `<span class="map-pop-city">${icon("city", 12)}${esc(cityName(docCityId(d)))}</span>` +
        `<button type="button" class="btn btn-solid map-pop-btn" data-open-doc="${esc(d.id)}">${esc(t("notifOpen"))}</button></div>`);
      markerLayer.addLayer(m);
    });
    if (docs.length) {
      const b = L.latLngBounds(docs.map(d => [Number(d.lat), Number(d.lng)]));
      mapObj.fitBounds(b.pad(0.25), { maxZoom: 15 });
    } else {
      const c = CITY_COORDS[state.city] || [35.2, 38.5];
      mapObj.setView(c, state.city ? 12 : 7);
    }
    setTimeout(() => { if (mapObj) mapObj.invalidateSize(); }, 250);
  }

  function openMapSection() {
    $("mapSection").hidden = false;
    ensureMap().then(m => { if (m) renderMap(); });
    setTimeout(() => { try { $("mapSection").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 90);
  }

  $("nearMeBtn").addEventListener("click", () => {
    if (!navigator.geolocation) { toast(t("mapNearErr"), "err"); return; }
    toast(t("mapLocating"));
    navigator.geolocation.getCurrentPosition(pos => {
      const acc = Number(pos.coords.accuracy) || 0;
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      renderListTools();
      renderList();
      ensureMap().then(m => { if (m) { renderMap(); m.flyTo([myPos.lat, myPos.lng], 13); } });
      /* Геолокация по Wi-Fi/IP может ошибаться на сотни км (ПК) — честно
         предупреждаем и даём ввести точные координаты вручную. */
      if (acc > 10000) toast(t("mapAccWarn").replace("%s", String(Math.round(acc / 1000))), "err", 6000);
    }, () => toast(t("mapNearErr"), "err"), { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });

  /* ---------- v1.3.0 · Ручные координаты («рядом со мной» промахнулся) и сворот карты ---------- */
  $("myPosBtn").addEventListener("click", () => {
    const r = $("myCoordRow");
    if (r) r.hidden = !r.hidden;
  });
  $("myCoordApply").addEventListener("click", () => {
    const la = Number(String($("myCoordLat").value).trim().replace(",", "."));
    const ln = Number(String($("myCoordLng").value).trim().replace(",", "."));
    if (!Number.isFinite(la) || !Number.isFinite(ln) || Math.abs(la) > 90 || Math.abs(ln) > 180) {
      toast(t("mapCoordErr"), "err"); return;
    }
    myPos = { lat: la, lng: ln };
    renderListTools();
    renderList();
    ensureMap().then(m => { if (m) { renderMap(); m.flyTo([la, ln], 13); } });
  });
  let mapFolded = false;
  $("mapFoldBtn").addEventListener("click", () => {
    mapFolded = !mapFolded;
    const shell = document.querySelector("#mapSection .map-shell");
    if (shell) shell.hidden = mapFolded;
    const txt = $("mapFoldTxt");
    if (txt) txt.textContent = t(mapFolded ? "mapUnfold" : "mapFold");
    if (!mapFolded && mapObj) setTimeout(() => { try { mapObj.invalidateSize(); } catch {} }, 120);

  /* ---------- Метка на карте в формах (админ + заявка) ---------- */
  function makeMapPick(citySel, ids) {
    let map = null, marker = null, coord = { lat: null, lng: null }, built = false;
    function putMarker() {
      if (!map) return;
      if (marker) marker.remove();
      marker = L.marker([coord.lat, coord.lng], { draggable: true }).addTo(map);
      marker.on("dragend", () => {
        const ll = marker.getLatLng();
        coord = { lat: Math.round(ll.lat * 1e6) / 1e6, lng: Math.round(ll.lng * 1e6) / 1e6 };
        const v = $(ids.val);
        if (v) v.textContent = coord.lat + ", " + coord.lng;
        const li = ids.lat && $(ids.lat), gi = ids.lng && $(ids.lng);
        if (li) li.value = coord.lat;
        if (gi) gi.value = coord.lng;
      });
    }
    function setCoord(lat, lng) {
      coord = { lat: Math.round(Number(lat) * 1e6) / 1e6, lng: Math.round(Number(lng) * 1e6) / 1e6 };
      const v = $(ids.val), c = $(ids.clear);
      if (v) { v.hidden = false; v.textContent = coord.lat + ", " + coord.lng; }
      if (c) c.hidden = false;
      const li = ids.lat && $(ids.lat), gi = ids.lng && $(ids.lng);
      if (li) li.value = coord.lat;
      if (gi) gi.value = coord.lng;
      putMarker();
    }
    function centerCity() {
      if (!map) return;
      const c = CITY_COORDS[$(citySel).value] || [35.2, 38.5];
      map.setView(c, 12);
    }
    async function build() {
      if (built) return;
      built = true;
      try { await loadLeaflet(); }
      catch { toast(t("mapLoadErr"), "err", 6000); built = false; return; }
      const el = $(ids.canvas);
      if (!el || !window.L) return;
      map = L.map(el);
      attachTiles(map);
      map.on("click", e => setCoord(e.latlng.lat, e.latlng.lng));
      if (coord.lat != null) { putMarker(); map.setView([coord.lat, coord.lng], 14); }
      else centerCity();
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
    }
    $(ids.btn).addEventListener("click", async () => {
      const box = $(ids.box), hint = $(ids.hint);
      if (box) box.hidden = false;
      if (hint) hint.hidden = false;
      const row = ids.row && $(ids.row);
      if (row) row.hidden = false;
      await build();
      if (!map) return;
      if (coord.lat != null) map.setView([coord.lat, coord.lng], 14);
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
    });
    if (ids.apply) $(ids.apply).addEventListener("click", () => {
      const la = Number(String($(ids.lat).value).trim().replace(",", "."));
      const ln = Number(String($(ids.lng).value).trim().replace(",", "."));
      if (!Number.isFinite(la) || !Number.isFinite(ln) || Math.abs(la) > 90 || Math.abs(ln) > 180) {
        toast(t("mapCoordErr"), "err"); return;
      }
      setCoord(la, ln);
      if (map) map.setView([coord.lat, coord.lng], 15);
    });
    $(ids.clear).addEventListener("click", () => {
      coord = { lat: null, lng: null };
      if (marker) { marker.remove(); marker = null; }
      const v = $(ids.val), c = $(ids.clear);
      if (v) v.hidden = true;
      if (c) c.hidden = true;
      const li = ids.lat && $(ids.lat), gi = ids.lng && $(ids.lng);
      if (li) li.value = "";
      if (gi) gi.value = "";
    });
    return {
      get: () => coord,
      set: (lat, lng) => { if (lat != null && lng != null) setCoord(lat, lng); },
      recenter: () => { if (map && coord.lat == null) centerCity(); },
      reset: () => {
        coord = { lat: null, lng: null };
        if (marker) { marker.remove(); marker = null; }
        const v = $(ids.val), c = $(ids.clear), b = $(ids.box), h = $(ids.hint);
        if (v) v.hidden = true;
        if (c) c.hidden = true;
        if (b) b.hidden = true;
        if (h) h.hidden = true;
        const row = ids.row && $(ids.row);
        if (row) row.hidden = true;
        const li = ids.lat && $(ids.lat), gi = ids.lng && $(ids.lng);
        if (li) li.value = "";
        if (gi) gi.value = "";
      }
    };
  }
  const fPick = makeMapPick("fCity", { btn: "fMapBtn", clear: "fMapClear", val: "fMapVal", box: "fMapBox", canvas: "fMapCanvas", hint: "fMapHint", lat: "fMapLat", lng: "fMapLng", apply: "fMapApply", row: "fMapCoordRow" });
  const aPick = makeMapPick("aCity", { btn: "aMapBtn", clear: "aMapClear", val: "aMapVal", box: "aMapBox", canvas: "aMapCanvas", hint: "aMapHint", lat: "aMapLat", lng: "aMapLng", apply: "aMapApply", row: "aMapCoordRow" });
  $("fCity").addEventListener("change", () => fPick.recenter());
  $("aCity").addEventListener("change", () => aPick.recenter());

  /* ---------- Центр уведомлений: 3 сценария ----------
     1) «Новое в вашем городе» — анкеты, появившиеся после прошлого визита;
     2) «Заявка одобрена» — карточка с номером из МОЕЙ заявки появилась в справочнике;
     3) «Карточка истекает» — моя карточка (номер совпал) удаляется через ≤3 дней.
     Всё клиент-side: мои номера хранит только собственный браузер (dalil_sentphones). */
  const NOTIF_KEY = "dalil_notifs";
  const notifState = (() => {
    let s = {};
    try { s = JSON.parse(store.get(NOTIF_KEY) || "{}") || {}; } catch {}
    if (typeof s.lastVisit !== "number") s.lastVisit = Date.now();
    if (!Array.isArray(s.seenIds)) s.seenIds = [];
    if (!Array.isArray(s.approvedIds)) s.approvedIds = [];
    if (!Array.isArray(s.dismissed)) s.dismissed = [];
    if (typeof s.lastSent !== "number") s.lastSent = 0;
    return s;
  })();
  const saveNotifState = () => store.set(NOTIF_KEY, JSON.stringify(notifState));
  let notifCache = [];
  const myPhoneTails = () => { try { return JSON.parse(store.get("dalil_sentphones") || "[]") || []; } catch { return []; } };
  const phoneTailOf = (p) => (p.phone || "").replace(/\D/g, "").slice(-9);
  const docTs = (d) => (d.createdAt && d.createdAt.seconds) ? d.createdAt.seconds * 1000
                    : (typeof d.createdAt === "number" ? d.createdAt : 0);

  function updateNotifications() {
    try {
      const now = Date.now();
      const tails = myPhoneTails();
      const out = [];
      state.docs.forEach(d => {
        if (isExpired(d)) return;
        const ts = docTs(d);
        const tail = phoneTailOf(d);
        /* 1) новое в выбранном городе */
        if (state.city && ts && ts > notifState.lastVisit &&
            docCityId(d) === state.city && !notifState.seenIds.includes("new:" + d.id))
          out.push({ id: "new:" + d.id, type: "new", ts, doc: d });
        /* 2) моя заявка одобрена; 3) моя карточка истекает */
        if (tail && tails.includes(tail)) {
          if (ts && ts > Math.max(notifState.lastVisit, notifState.lastSent) &&
              !notifState.approvedIds.includes(d.id)) {
            out.push({ id: "appr:" + d.id, type: "appr", ts, doc: d });
            notifState.approvedIds.push(d.id);
          }
          if (d.expiresAt && d.expiresAt > now && d.expiresAt - now <= REM_WINDOW)
            out.push({ id: "exp:" + d.id + ":" + d.expiresAt, type: "exp", ts: now, doc: d });
        }
      });
      const seen = new Set();
      notifCache = out
        .filter(i => !seen.has(i.id) && seen.add(i.id))
        .filter(i => !notifState.dismissed.includes(i.id))
        .sort((a, b) => b.ts - a.ts)
        .slice(0, 30);
      notifState.approvedIds = notifState.approvedIds.slice(-100);
      notifState.dismissed = notifState.dismissed.slice(-100);
      saveNotifState();
      updateNotifBadge();
    } catch (e) { console.error("notifs:", e); }
  }

  function unreadNotifCount() {
    return notifCache.filter(i => !notifState.seenIds.includes(i.id)).length;
  }
  function updateNotifBadge() {
    const el = $("notifBadge");

    const n = unreadNotifCount();
    el.hidden = !n;

  }

  function agoStr(ts) {
    const s = Math.max(0, Date.now() - ts);
    if (s < 60000) return t("agoNow");
    if (s < 3600000) return t("agoMin").replace("{n}", Math.floor(s / 60000));
    if (s < 86400000) return t("agoH").replace("{n}", Math.floor(s / 3600000));
    return t("agoD").replace("{n}", Math.floor(s / 86400000));
  }

  function renderNotifs() {
    const list = $("notifList");
    if (!list) return;
    if (!notifCache.length) {
      list.innerHTML = `<div class="notif-empty">${icon("bell", 26)}<p>${esc(t("notifEmpty"))}</p></div>`;
      return;
    }
    list.innerHTML = notifCache.map((it, i) => {
      const d = it.doc || {};
      const unread = !notifState.seenIds.includes(it.id);
      const ttl = t(it.type === "new" ? "notifNewT" : it.type === "appr" ? "notifApprT" : "notifExpT");
      const days = d.expiresAt ? String(Math.max(1, Math.ceil((d.expiresAt - Date.now()) / 86400000))) : "3";
      const desc = (it.type === "new" ? t("notifNewD") : it.type === "appr" ? t("notifApprD") : t("notifExpD"))
        .replace("{name}", pname(d) || "")
        .replace("{city}", cityName(docCityId(d)))
        .replace("{n}", days);
      const ic = it.type === "new" ? icon("pin", 17) : it.type === "appr" ? icon("check", 17) : icon("bell", 17);
      const tel = (d.phone || "").replace(/\D/g, "");
      const actions = it.type === "exp"
        ? `${tel ? `<a class="btn btn-solid" href="https://wa.me/${esc(tel)}" target="_blank" rel="noopener">${icon("send", 13)}${esc(t("notifRenew"))}</a>` : ""}
           <button type="button" class="btn btn-outline" data-notif-hide="${esc(it.id)}">${esc(t("notifHide"))}</button>`
        : `<button type="button" class="btn btn-outline" data-notif-open="${esc(d.id)}">${esc(t("notifOpen"))}</button>`;
      return `
        <div class="notif-item${unread ? " unread" : ""}" style="animation-delay:${Math.min(i * 40, 280)}ms">
          <span class="ni-ic">${ic}</span>
          <span class="ni-body">
            <span class="ni-top"><b>${esc(ttl)}</b><span class="ni-time">${esc(agoStr(it.ts))}</span></span>
            <span class="ni-desc">${esc(desc)}</span>
            <span class="ni-actions">${actions}</span>
          </span>
        </div>`;
    }).join("");
  }

  async function copyPhoneText(phone) {
    let ok = false;
    try { await navigator.clipboard.writeText(phone || ""); ok = true; }
    catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = phone || "";
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ok = document.execCommand("copy");
        ta.remove();
      } catch (e2) { ok = false; }
    }
    toast(ok ? t("copied") : (phone || ""));
  }

  function shareProvider(p) {

  /* ================= v1.3.0 · Скачать контакт (vCard .vcf) =================
     Один клик — номер сохраняется в телефонную книгу: имя как в анкете,
     телефон, категория и город в NOTE. Файл генерируется на клиенте. */
  function downloadVcf(p) {
    const tel = (p.phone || "").replace(/[^\d+]/g, "");
    if (!tel) return;
    const name = pname(p) || "DALIL SURIYA";
    const note = `DALIL SURIYA — ${subName(p.group, p.subcategory)}, ${cityName(docCityId(p))}`;
    const vcf =
      "BEGIN:VCARD\r\nVERSION:3.0\r\n" +
      `FN:${name}\r\n` +
      `TEL;TYPE=CELL:${tel}\r\n` +
      `NOTE:${note}\r\n` +
      "END:VCARD\r\n";
    const fname = name.replace(/[\\/:*?"<>|\n\r]+/g, " ").trim().slice(0, 60) || "contact";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard;charset=utf-8" }));
    a.download = fname + ".vcf";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast(t("vcfOk"));
  }

  /* ================= v1.2.3 · Мастер заявки: цена → правила → анкета =================
     Публичная форма: после личной оплаты человек сам подаёт заявку.
     Заявка уходит в коллекцию applications со статусом pending и НЕ попадает
     в справочник, пока админ не одобрит её в очереди заявок.
     ЦЕНЫ НЕ МЕНЯТЬ: m1 = $2.50 · m3 = $7.00 · y1 = $15.00 */
  const PLAN_PRICE = { m1: "$2.50", m3: "$7.00", y1: "$15.00" };
  const PLAN_TTL  = { m1: 2592000000, m3: 7776000000, y1: 31536000000 }; /* 1 / 3 / 12 мес */
  const planName = (p) => t(p === "m1" ? "subM1" : p === "m3" ? "subM3" : "subY1");

  /* ================= v1.3.2 · ПРОМО-ИВЕНТ «1 месяц бесплатно» =================
     Акция действует ДО 17.10.2026 включительно (локальное время устройства).
     Постоянные ЦЕНЫ НЕ ТРОНУТЫ (PLAN_PRICE выше) — после даты всё возвращается
     само: красный баннер на главной скроется, тариф m1 снова будет $2.50, в
     WhatsApp и в заявку уйдёт обычная цена. Затронут ТОЛЬКО тариф «1 месяц» (m1).
     АВТОСНЯТИЕ: promoActive() проверяется при каждой загрузке, плюс ежеминутный
     сторож и проверка при возврате на вкладку — акция снимается даже если
     приложение простояло открытым через момент истечения (без перезагрузки). */
  const PROMO_END = new Date(2026, 9, 17, 23, 59, 59, 999);   /* 17.10.2026, конец дня */
  const promoActive = () => Date.now() <= PROMO_END.getTime();
  const planPriceStr = (p) => (promoActive() && p === "m1") ? "$0.00" : PLAN_PRICE[p];
  let promoApplied = false;   /* промо-оформление сейчас на экране */

  function applyPromo(){
    const bar = $("promoBar");
    if (bar) bar.hidden = !promoActive();
    if (!promoActive()) return;
    const m1 = document.querySelector('#subOverlay .plan[data-plan="m1"]');
    if (m1) {
      m1.classList.add("promo");
      const pr = m1.querySelector(".plan-price");
      if (pr) pr.innerHTML = '<s>$2.50</s>&nbsp;<b>$0.00</b>';
      const badge = document.createElement("span");
      badge.className = "plan-free";
      badge.setAttribute("data-i18n", "promoFree");
      badge.textContent = t("promoFree");
      m1.appendChild(badge);
    }
    promoApplied = true;
  }

  /* Сторож автоснятия: после 17.10.2026 гасит баннер и возвращает цены на лету */
  function expirePromo(){
    if (!promoApplied) return;
    promoApplied = false;
    const bar = $("promoBar");
    if (bar) bar.hidden = true;
    const m1 = document.querySelector('#subOverlay .plan[data-plan="m1"]');
    if (m1) {
      m1.classList.remove("promo");
      const pr = m1.querySelector(".plan-price");
      if (pr) pr.textContent = "$2.50";
      const badge = m1.querySelector(".plan-free");
      if (badge) badge.remove();
    }
  }
  applyPromo();
  setInterval(() => { if (!promoActive()) expirePromo(); }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !promoActive()) expirePromo();
  });

  $("appForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!selectedPlan) { goAppStep(1); banner($("appErr"), "subSelectPlan"); return; }
    const cat = catById($("aCat").value);
    const groupId = cat.levels ? $("aLevel").value : cat.id;
    const subcat = $("aSub").value;
    const title = $("aTitle").value.trim();
    const titleEn = $("aTitleEn").value.trim();
    const phone = $("aPhone").value.trim();
    const location = $("aLoc").value.trim();
    const carMake = $("aCar").value.trim();
    const description = $("aDesc").value.trim();
    const city = $("aCity").value;

    if (!city || !title || !phone || !groupId) { banner($("appErr"), "fillRequired"); return; }
    if (!/^\+?\d{7,15}$/.test(phone)) { banner($("appErr"), "phoneBad"); return; }
    /* ================= v1.2.7 · АНТИСПАМ ЗАЯВОК =================
       1) Боты отправляют мгновенно — человек физически не заполняет
          анкету быстрее 2.5 секунд после открытия мастера;
       2) повторная заявка с того же номера отклоняется — номера успешно
          отправленных заявок хранятся в браузере (dalil_sentphones,последние 20). */
    if (Date.now() - appOpenedAt < 2500) { banner($("appErr"), "appTooFast"); return; }
    const phoneTail = phone.replace(/\D/g, "").slice(-9);
    try {
      const sentPhones = JSON.parse(store.get("dalil_sentphones") || "[]");
      if (sentPhones.includes(phoneTail)) { banner($("appErr"), "appDup"); return; }
    } catch {}
    if (needsLocation(cat, subcat) && !location) { banner($("appErr"), "locRequired"); return; }
    const routes = subcat === "transport" ? appRoutes.slice() : [];
    if (subcat === "transport" && !routes.length) { banner($("appErr"), "routeRequired"); return; }
    if (subcat === "transport" && !carMake) { banner($("appErr"), "carMakeRequired"); return; }
    if (description.length > 600) { banner($("appErr"), "descLimit"); return; }

    const btn = $("appSendBtn");
    btn.disabled = true;
    btn.textContent = t("appSending");

    try {
      const payload = {
        plan: selectedPlan,
        planPrice: planPriceStr(selectedPlan),   /* v1.3.2: в промо m1 = $0.00 */
        type: cat.base === "stores" || cat.base === "pharmacies" ? "store"
             : cat.base === "services" || cat.base === "repair" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: subcat,
        city,
        carMake: subcat === "transport" ? carMake : "",
        routes,
        title, phone, location, description,
        names: { ar: title },
        uiLang: state.lang            /* на каком языке заполняли — подсказка админу */
      };
      /* v1.3.0: точка на карте (необязательно) — едет в заявку, потом в карточку */
      const aCoord = aPick.get();
      if (aCoord.lat != null && aCoord.lng != null) { payload.lat = aCoord.lat; payload.lng = aCoord.lng; }
      /* v1.3.0: отметка времени — уведомление «заявка одобрена» сработает после него */
      notifState.lastSent = Date.now();
      saveNotifState();
      if (titleEn) payload.names.en = titleEn;
      const appR = await withTimeout(fetch(API + "/api/application", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, deviceId })
      }), 20000);
      const appJ = await appR.json();
      if (!appJ.ok) throw Object.assign(new Error(appJ.error || "app_failed"), { code: appJ.error });

      /* v1.2.7: заявка ушла — запоминаем номер (последние 20), чтобы
         отклонять повторные заявки с того же телефона */
      try {
        const sentPhones = JSON.parse(store.get("dalil_sentphones") || "[]");
        sentPhones.push(phoneTail);
        store.set("dalil_sentphones", JSON.stringify(sentPhones.slice(-20)));
      } catch {}

      /* v1.2.6: кнопка = «Заплатить в WhatsApp»; текст чата собирается
         автоматически из анкеты — тариф (срок), имя как в анкете,
         категория, город, номер — Аммару ничего не нужно переспрашивать */
      const waNum = WA_SUPPORT.replace(/\D/g, "");
      const msg = encodeURIComponent(
        `${t("appDoneWaMsg")}\n` +
        `${t("waLblPlan")}: ${planName(selectedPlan)} · ${planPriceStr(selectedPlan)}\n` +
        `${t("waLblName")}: ${title}\n` +
        `${t("waLblCat")}: ${subName(groupId, subcat)}\n` +
        `${t("waLblCity")}: ${cityName(city)}\n` +
        `${t("waLblPhone")}: ${phone}`);
      $("appDoneWa").href = `https://wa.me/${waNum}?text=${msg}`;
      $("appForm").reset();
      $("aDescCounter").textContent = "0 / 600";
      goAppStep(4);
      toast(t("appSentToast"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    } finally {
      btn.disabled = false;
      btn.textContent = t("appSend");
    }
  });

  let loginBusy = false;
  /* ================= v1.2.7 · ЗАЩИТА: блокировка подбора пароля =================
     После 5 неудачных попыток входа форма блокируется на 5 минут (localStorage
     dalil_lockuntil — переживает перезагрузку). Сброс — при успешном входе. */
  const LOCK_KEY = "dalil_lockuntil";
  const LOCK_TRIES = 5, LOCK_MS = 5 * 60 * 1000;
  let loginFails = 0;
  function loginLockedLeft() {
    const until = Number(store.get(LOCK_KEY) || 0);
    return until > Date.now() ? Math.ceil((until - Date.now()) / 60000) : 0;
  }
  function loginNoteFail() {
    if (++loginFails >= LOCK_TRIES) {
      store.set(LOCK_KEY, String(Date.now() + LOCK_MS));
      loginFails = 0;
    }
  }
  async function doLogin() {
    if (loginBusy) return;
    const lockMin = loginLockedLeft();
    if (lockMin) {
      bannerMsg($("loginErr"), t("loginLocked").replace("{min}", lockMin));
      return;
    }
    const pw = $("passInput").value.trim();
    if (!pw) { banner($("loginErr"), "fillRequired"); return; }

    const btn = $("loginSubmitBtn");
    loginBusy = true;
    btn.disabled = true;
    btn.textContent = t("loginBusy");

    try {
      const r = await withTimeout(fetch(API + "/api/admin/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      }), 15000);
      const j = await r.json();
      if (j.ok && j.token) {
        adminToken = j.token;
        try { store.set(ADM_TOK_KEY, j.token); } catch (e) {}
        state.admin = true;
        loginFails = 0;
        store.set(LOCK_KEY, "0");
        syncAdminUI();
        watchReqs(); watchReports();
        closeOv("loginOverlay");
        toast(t("toastWelcome"));
      } else {
        loginNoteFail();   /* неверный пароль = попытка подбора */
        const left = loginLockedLeft();
        bannerMsg($("loginErr"), left
          ? t("loginLocked").replace("{min}", left)
          : t("eCreds"));
      }
    } catch (err) {
      console.error("Admin login error:", err && err.message);
      loginNoteFail();
      const left = loginLockedLeft();
      bannerMsg($("loginErr"), left
        ? t("loginLocked").replace("{min}", left)
        : t("eNet"));
    } finally {
      loginBusy = false;
      btn.disabled = false;
      btn.textContent = t("login");
    }
  }

  $("loginSubmitBtn").addEventListener("click", doLogin);
  $("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  $("passInput").addEventListener("keydown", e => {

  /* 🔒 Телефон: при вводе остаются только цифры и один «+» в начале (макс. 20 символов) */
  function sanitizePhone(el) {
    let v = String(el.value).replace(/[^\d+]/g, "").slice(0, 20);
    v = (v.startsWith("+") ? "+" : "") + v.replace(/\+/g, "");
    if (el.value !== v) el.value = v;
  }
  $("fPhone").addEventListener("input", e => sanitizePhone(e.target));
  /* 🔒 Поле скрутки просмотров — только цифры (защита от мусора и минусов) */
  document.addEventListener("input", e => {
    if (e.target && e.target.classList && e.target.classList.contains("views-dec-input")) {
      const v = String(e.target.value).replace(/[^\d]/g, "").slice(0, 6);
      if (e.target.value !== v) e.target.value = v;
    }
  });

  function fillCatSelect() {
    $("fCity").innerHTML = CITIES.map(c =>
      `<option value="${c.id}"${state.city === c.id ? " selected" : ""}>${esc(nm(c))}</option>`).join("");
    $("fCat").innerHTML = CATS.map(c =>

  }
  function syncLevelSelect() {
    const cat = catById($("fCat").value);
    if (cat.levels) {
      $("fLevelField").hidden = false;
      $("fLevel").innerHTML = cat.levels.map(l =>
        `<option value="${l.id}"${state.level === l.id ? " selected" : ""}>${esc(levelName(l))}</option>`).join("");
    } else {
      $("fLevelField").hidden = true;
      $("fLevel").innerHTML = "";
    }
    fillSubSelect();
  }
  function fillSubSelect() {
    const cat = catById($("fCat").value);
    const lv = cat.levels
      ? (cat.levels.find(l => l.id === $("fLevel").value) || cat.levels[0])
      : levelsOf(cat)[0];
    $("fSub").innerHTML = lv.subs.map(s =>
      `<option value="${s.id}">${esc(nm(s))}</option>`).join("");
    updateLocLabel();
  }
  function updateLocLabel() {
    const cat = catById($("fCat").value);
    if (!cat) return; /* селекты ещё не заполнены — нечего синхронизировать */
    const subcat = $("fSub").value;
    const must = needsLocation(cat, subcat);
    $("fLocLabel").innerHTML = esc(t("fLocation")) + (must ? ' <span class="req">*</span>' : "");
    $("fTitle").placeholder = t(cat.base === "stores" || cat.base === "pharmacies" ? "fTitleStore"
                              : cat.base === "repair" ? "fTitleRepair"
                              : cat.base === "services" ? "fTitleVenue"
                              : "fTitlePerson");
    const isTransport = subcat === "transport";
    $("fCarField").hidden = !isTransport;
    $("fCarLabel").innerHTML = esc(t("carMake")) + (isTransport ? ' <span class="req">*</span>' : "");
    if (!isTransport) $("fCar").value = "";
    syncRoutesUI();
  }

  /* ============ Маршруты (перевозки): пункт А = город карточки (автоматически,
     выбирается выше в поле «Город»), пункт Б — тап по городам ниже ============ */
  function syncRoutesUI() {
    const subcat = $("fSub").value;
    const isTransport = subcat === "transport";
    $("fRoutesField").hidden = !isTransport;
    if (!isTransport) return;
    const city = $("fCity").value;
    if (formRoutes.includes(city)) formRoutes = formRoutes.filter(id => id !== city);
    $("fRoutesPick").innerHTML = CITIES.filter(c => c.id !== city).map(c =>
      `<button type="button" class="chip${formRoutes.includes(c.id) ? " on" : ""}" data-route="${c.id}">${esc(nm(c))}</button>`).join("");
  }
  $("fCat").addEventListener("change", syncLevelSelect);
  $("fLevel").addEventListener("change", fillSubSelect);
  $("fSub").addEventListener("change", updateLocLabel);
  $("fCity").addEventListener("change", syncRoutesUI);
  /* Пункт Б: тап по городу добавляет/убирает направление (повторный тап — снимает) */
  $("fRoutesPick").addEventListener("click", e => {
    const b = e.target.closest("[data-route]");
    if (!b) return;
    const id = b.dataset.route;
    if (formRoutes.includes(id)) {
      formRoutes = formRoutes.filter(x => x !== id);

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cat = catById($("fCat").value);
    const groupId = cat.levels ? $("fLevel").value : cat.id;
    const subcat = $("fSub").value;
    const title = $("fTitle").value.trim();      /* название на арабском (обязательно) */
    const titleEn = $("fTitleEn").value.trim();  /* название на английском (по желанию) */
    const phone = $("fPhone").value.trim();
    const location = $("fLoc").value.trim();
    const carMake = $("fCar").value.trim();
    const description = $("fDesc").value.trim();
    const ttlMs = Number($("fExp").value) || 2592000000;
    const city = $("fCity").value;

    if (!city) { banner($("addErr"), "fillRequired"); return; }
    if (!title || !phone || !groupId) { banner($("addErr"), "fillRequired"); return; }
    if (!/^\+?\d{7,15}$/.test(phone)) { banner($("addErr"), "phoneBad"); return; }
    if (needsLocation(cat, subcat) && !location) { banner($("addErr"), "locRequired"); return; }
    const routes = subcat === "transport" ? formRoutes.slice() : [];
    if (subcat === "transport" && !routes.length) { banner($("addErr"), "routeRequired"); return; }
    if (subcat === "transport" && !carMake) { banner($("addErr"), "carMakeRequired"); return; }
    if (description.length > 600) { banner($("addErr"), "descLimit"); return; }

    /* busy-состояние: кнопка сразу показывает «Сохранение…» — видно, что клик сработал,
       даже если сервер отвечает долго (медленная сеть) */
    const saveBtn = $("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = t("saving");

    try {
      const payload = {
        type: cat.base === "stores" || cat.base === "pharmacies" ? "store"
             : cat.base === "services" || cat.base === "repair" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: subcat,
        city,
        carMake: subcat === "transport" ? carMake : "",
        routes,
        title, phone, location, description
      };
      /* names — только ручные названия: арабский (обязателен) + английский (если заполнен).
         Автоперевода больше нет; при правке карта перезаписывается целиком —
         старые автоматические переводы (ru/ku) удаляются вместе с ней */
      payload.names = { ar: title };
      if (titleEn) payload.names.en = titleEn;
      /* v1.3.0: метка на карте */
      const fCoord = fPick.get();
      payload.lat = (fCoord.lat != null) ? fCoord.lat : null;
      payload.lng = (fCoord.lng != null) ? fCoord.lng : null;
      if (editingId) {
        /* Правка: активную карточку не пересоздаём — срок хранения сохраняем,
           просроченную (или без даты) — продлеваем на выбранный период */
        const orig = state.docs.find(x => x.id === editingId);
        const expired = !orig || !orig.expiresAt || orig.expiresAt <= Date.now();
        payload.expiresAt = expired ? Date.now() + ttlMs : orig.expiresAt;
        await dbUpdate(editingId, payload);
        /* Мгновенно отражаем правку в списке: если менялся город — анкета
           переезжает в новый раздел сразу, не дожидаясь фоновой перезагрузки данных */
        const idx = state.docs.findIndex(x => x.id === editingId);
        if (idx !== -1) state.docs[idx] = { ...state.docs[idx], ...payload };
        renderAll();
        closeOv("addOverlay");
        toast(t("toastUpdated"));
      } else {
        payload.expiresAt = Date.now() + ttlMs;
        await dbAdd(payload);
        closeOv("addOverlay");
        toast(t("toastAdded"));
      }
      editingId = null;
      $("addModalTitle").textContent = t("addTitle");
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = t("save");
    }
  });
